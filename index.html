<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>撃って強化！ラストシューター</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1e;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;box-shadow:0 0 40px rgba(0,0,0,.6);border-radius:6px;touch-action:none;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
'use strict';
const W = 450, H = 800;            // logical portrait resolution (9:16)
const PLAYER_Y = H - 120;
const DEFENSE_Y = H - 80;          // enemies crossing this line hurt you
const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  scale = s;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.floor(W * s * dpr);
  cv.height = Math.floor(H * s * dpr);
}
window.addEventListener('resize', resize);
resize();

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function removeDead(arr) { let j = 0; for (let i = 0; i < arr.length; i++) if (!arr[i].dead) arr[j++] = arr[i]; arr.length = j; }
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fmt(n) { return n >= 10000 ? (n / 1000).toFixed(1) + 'k' : String(Math.floor(n)); }

// ---------- upgrade definitions ----------
const UPGRADES = {
  multi:  { label: '発射数 +1',   icon: '🔫', color: '#ff4fa3', apply: s => { s.multi = Math.min(s.multi + 1, 9); } },
  rate:   { label: '連射速度UP',  icon: '⚡', color: '#ffb321', apply: s => { s.rate = Math.min(s.rate * 1.25, 20); } },
  power:  { label: '攻撃力UP',    icon: '💥', color: '#ff5a3c', apply: s => { s.power += 1; } },
  ally:   { label: '仲間 +2',     icon: '👥', color: '#33d17a', apply: s => { s.allies = Math.min(s.allies + 2, 12); } },
  pierce: { label: '貫通 +1',     icon: '➶', color: '#3fa9ff', apply: s => { s.pierce = Math.min(s.pierce + 1, 5); } },
  heal:   { label: '体力回復',    icon: '❤', color: '#ff3b6b', apply: s => { s.hp = Math.min(s.hp + 1, s.maxHp); } },
};
const GATE_CAP = { ally: 6, power: 3, multi: 2 };
const UPG_KEYS = ['multi', 'rate', 'power', 'ally', 'pierce'];

// ---------- game state ----------
let state = 'title';   // title | play | over
let stats, player, bullets, enemies, blocks, gates, particles, texts, rings;
let time, score, kills, spawnT, blockT, gateT, bossT, fireT, shake, flash, best = 0, overT = 0, banner;
try { best = +localStorage.getItem('adShooterBest') || 0; } catch (e) {}

function reset() {
  stats = { multi: 1, rate: 7, power: 1, allies: 0, pierce: 0, hp: 5, maxHp: 5 };
  player = { x: W / 2, tx: W / 2, hurt: 0 };
  bullets = []; enemies = []; blocks = []; gates = []; particles = []; texts = []; rings = [];
  time = 0; score = 0; kills = 0; spawnT = 1; blockT = 3; gateT = 25; bossT = 45; fireT = 0;
  shake = 0; flash = 0; banner = null;
}
reset();

// ---------- input (mouse + touch via pointer events) ----------
let dragging = false, lastPX = 0;
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toLogical(e);
  if (state === 'title') { state = 'play'; reset(); return; }
  if (state === 'over') { if (overT > 0.6) { state = 'play'; reset(); } return; }
  dragging = true; lastPX = p.x;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!dragging || state !== 'play') return;
  const p = toLogical(e);
  player.tx = clamp(player.tx + (p.x - lastPX) * 1.3, 24, W - 24);
  lastPX = p.x;
});
const endDrag = () => { dragging = false; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', e => {
  if (state !== 'play') { if (e.key === ' ' || e.key === 'Enter') { state = 'play'; reset(); } return; }
  if (e.key === 'ArrowLeft' || e.key === 'a') player.tx = clamp(player.tx - 40, 24, W - 24);
  if (e.key === 'ArrowRight' || e.key === 'd') player.tx = clamp(player.tx + 40, 24, W - 24);
});

// ---------- effects ----------
function burst(x, y, color, n, spd = 220, size = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(spd * 0.3, spd);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.35, 0.8), max: 0.8, color, size: rand(size * 0.5, size * 1.4) });
  }
  if (particles.length > 700) particles.splice(0, particles.length - 700);
}
function popText(x, y, str, color = '#fff', size = 18, life = 0.7) {
  texts.push({ x, y, str, color, size, life, max: life, vy: -70 });
  if (texts.length > 120) texts.splice(0, texts.length - 120);
}
function addShake(v) { shake = Math.min(shake + v, 14); }

// ---------- spawning ----------
function difficulty() { return (1 + time / 40) * (1 + time / 180); }   // ramps steadily
function spawnEnemy(type) {
  const d = difficulty();
  let e;
  if (type === 'boss') {
    const hp = Math.floor(140 * d);
    e = { type, x: W / 2, y: -70, r: 52, hp, maxHp: hp, vy: 22, color: '#8e2de2', score: 500, wob: 0 };
    banner = { text: '⚠ ボス出現！ ⚠', t: 2 };
  } else if (type === 'tank') {
    const hp = Math.floor(rand(10, 16) * d);
    e = { type, x: rand(50, W - 50), y: -40, r: 28, hp, maxHp: hp, vy: rand(32, 42) + time * 0.15, color: '#5a6bff', score: 40, wob: Math.random() * 6 };
  } else if (type === 'runner') {
    const hp = Math.max(1, Math.floor(rand(1, 2.5) * d));
    e = { type, x: rand(30, W - 30), y: -20, r: 14, hp, maxHp: hp, vy: rand(90, 120) + time * 0.4, color: '#ffd23f', score: 15, wob: Math.random() * 6 };
  } else {
    const hp = Math.floor(rand(2, 4.5) * d);
    e = { type: 'grunt', x: rand(30, W - 30), y: -24, r: 18, hp, maxHp: hp, vy: rand(50, 70) + time * 0.3, color: '#ff4d4d', score: 10, wob: Math.random() * 6 };
  }
  e.flash = 0;
  enemies.push(e);
}
function spawnWave() {
  const d = difficulty();
  const n = Math.min(1 + Math.floor(d * 1.3), 9);
  const pattern = Math.random();
  if (pattern < 0.35) {           // row formation
    const gap = (W - 60) / Math.max(n - 1, 1);
    for (let i = 0; i < n; i++) { spawnEnemy('grunt'); const e = enemies[enemies.length - 1]; e.x = 30 + gap * i; e.y = -24 - (i % 2) * 18; }
  } else {
    for (let i = 0; i < n; i++) {
      const r = Math.random();
      spawnEnemy(time > 20 && r < 0.15 ? 'tank' : time > 10 && r < 0.4 ? 'runner' : 'grunt');
      enemies[enemies.length - 1].y -= rand(0, 120);
    }
  }
}
function spawnBlock() {
  const key = stats.hp < 3 && Math.random() < 0.35 ? 'heal' : pick(UPG_KEYS);
  const base = 15 + Math.floor(time / 5) * 3;
  const n = clamp(randi(base, base + 20), 15, 80 + Math.floor(time / 2));
  blocks.push({ key, x: rand(70, W - 70), y: -50, w: 110, h: 70, n, max: n, vy: 45 + Math.min(time * 0.2, 30), flash: 0, pulse: 0, dead: false });
}
function spawnGates() {
  // ad-style gate pair: one usually better; shooting a gate raises its value
  const opts = [
    { key: 'ally', v: randi(1, 3), unit: '仲間' },
    { key: 'multi', v: 1, unit: '発射数' },
    { key: 'power', v: randi(1, 2), unit: '攻撃力' },
  ];
  const good = pick(opts);
  const bad = { key: pick(['ally', 'power']), v: -randi(2, 5) };
  bad.unit = bad.key === 'ally' ? '仲間' : '攻撃力';
  const pair = Math.random() < 0.5 ? [good, bad] : [bad, good];
  const gid = Math.random();
  pair.forEach((g, i) => gates.push({ gid, x: i === 0 ? 0 : W / 2, y: -60, w: W / 2, h: 46, key: g.key, v: g.v, unit: g.unit, acc: 0, vy: 60, used: false, dead: false, flash: 0 }));
}

// ---------- firing ----------
function shootFrom(x, y, count, dmg) {
  const spread = 0.09;
  for (let i = 0; i < count; i++) {
    const a = (i - (count - 1) / 2) * spread;
    bullets.push({ x: x + (i - (count - 1) / 2) * 6, y, vx: Math.sin(a) * 760, vy: -Math.cos(a) * 760, dmg, pierce: stats.pierce, hit: null, dead: false });
  }
}
function allyPos(i) {
  // compact 2-row formation around the leader (max 12)
  const side = i % 2 === 0 ? -1 : 1, rank = Math.floor(i / 2);
  const row = rank < 3 ? 0 : 1, col = rank % 3;
  const x = player.x + side * (row === 0 ? 32 + col * 22 : 18 + col * 22);
  return { x: clamp(x, 12, W - 12), y: PLAYER_Y + 8 + row * 24 + col * 3 };
}

// ---------- update ----------
function hurtPlayer(amount) {
  stats.hp -= amount; player.hurt = 0.5; flash = 0.35; addShake(10);
  popText(player.x, PLAYER_Y - 40, '-' + amount + ' HP', '#ff4060', 26, 1);
  if (stats.hp <= 0) {
    stats.hp = 0; state = 'over'; overT = 0;
    burst(player.x, PLAYER_Y, '#ffffff', 60, 400, 6);
    if (score > best) { best = score; try { localStorage.setItem('adShooterBest', best); } catch (e) {} }
  }
}

function applyUpgrade(key, x, y) {
  const u = UPGRADES[key];
  u.apply(stats);
  popText(x, y - 10, u.label + '！', u.color, 30, 1.3);
  burst(x, y, u.color, 50, 380, 6); burst(x, y, '#ffffff', 20, 260, 3);
  rings.push({ x, y, r: 10, life: 0.5, color: u.color });
  addShake(6);
}

function update(dt) {
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  shake = Math.max(0, shake - dt * 30); flash = Math.max(0, flash - dt);
  // particles/texts always update
  for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy = p.vy * 0.92 + 300 * dt; if (p.life <= 0) p.dead = true; }
  removeDead(particles);
  for (const t of texts) { t.life -= dt; t.y += t.vy * dt; t.vy *= 0.94; if (t.life <= 0) t.dead = true; }
  removeDead(texts);
  for (const r of rings) { r.life -= dt; r.r += 400 * dt; if (r.life <= 0) r.dead = true; }
  removeDead(rings);
  if (state === 'over') { overT += dt; return; }
  if (state !== 'play') return;

  time += dt;
  player.x += (player.tx - player.x) * Math.min(1, dt * 18);
  player.hurt = Math.max(0, player.hurt - dt);

  // spawns
  spawnT -= dt;
  if (spawnT <= 0) { spawnWave(); spawnT = Math.max(0.9, 2.6 - time * 0.02); }
  blockT -= dt;
  if (blockT <= 0) { spawnBlock(); blockT = rand(6, 9); }
  gateT -= dt;
  if (gateT <= 0) { spawnGates(); gateT = rand(22, 30); }
  bossT -= dt;
  if (bossT <= 0) { spawnEnemy('boss'); bossT = 60; }

  // fire
  fireT -= dt;
  if (fireT <= 0) {
    fireT += 1 / stats.rate;
    if (fireT < 0) fireT = 0;
    shootFrom(player.x, PLAYER_Y - 26, stats.multi, stats.power);
    for (let i = 0; i < stats.allies; i++) { const a = allyPos(i); shootFrom(a.x, a.y - 14, 1, Math.max(1, Math.ceil(stats.power / 2))); }
  }

  // bullets
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -20 || b.x < -20 || b.x > W + 20) { b.dead = true; continue; }
    // blocks first (they're the juicy target)
    for (const k of blocks) {
      if (k.dead || (b.hit && b.hit.has(k))) continue;
      if (b.x > k.x - k.w / 2 && b.x < k.x + k.w / 2 && b.y > k.y - k.h / 2 && b.y < k.y + k.h / 2) {
        k.n -= 1; k.flash = 0.06; k.pulse = 0.12;
        burst(b.x, b.y, UPGRADES[k.key].color, 2, 120, 3);
        if (k.n <= 0) { k.dead = true; applyUpgrade(k.key, k.x, k.y); score += 50; }
        b.dead = true; break;
      }
    }
    if (b.dead) continue;
    for (const g of gates) {
      if (g.dead || g.used) continue;
      if (b.x > g.x && b.x < g.x + g.w && b.y > g.y - g.h / 2 && b.y < g.y + g.h / 2) {
        g.acc += 1; g.flash = 0.05;
        const need = g.v < 0 ? 4 : 20, cap = GATE_CAP[g.key];
        if (g.acc >= need && g.v < cap) { g.acc = 0; g.v += 1; popText(b.x, g.y, '+1', '#9fffd0', 16, 0.5); }
        b.dead = true; break;
      }
    }
    if (b.dead) continue;
    for (const e of enemies) {
      if (e.dead) continue;
      if (b.hit && b.hit.has(e)) continue;
      const dx = b.x - e.x, dy = b.y - e.y;
      if (dx * dx + dy * dy < (e.r + 4) * (e.r + 4)) {
        e.hp -= b.dmg; e.flash = 0.06;
        popText(e.x + rand(-12, 12), e.y - e.r, String(b.dmg), '#fff', 14 + Math.min(b.dmg, 10), 0.5);
        burst(b.x, b.y, '#fff3a0', 2, 100, 2.5);
        if (e.hp <= 0) killEnemy(e);
        if (b.pierce > 0) { b.pierce--; (b.hit || (b.hit = new Set())).add(e); }
        else { b.dead = true; break; }
      }
    }
  }
  removeDead(bullets);
  if (bullets.length > 900) bullets.splice(0, bullets.length - 900);

  // enemies
  for (const e of enemies) {
    if (e.dead) continue;
    e.wob += dt * 4; e.flash = Math.max(0, e.flash - dt);
    e.y += e.vy * dt;
    if (e.type === 'boss') e.x = W / 2 + Math.sin(time * 0.8) * 120;
    else e.x += Math.sin(e.wob) * 20 * dt;
    if (e.y + e.r * 0.5 > DEFENSE_Y) {
      e.dead = true;
      burst(e.x, DEFENSE_Y, e.color, 25, 260, 5);
      hurtPlayer(e.type === 'boss' ? 5 : e.type === 'tank' ? 2 : 1);
      if (state !== 'play') return;
    }
  }
  removeDead(enemies);

  // blocks
  for (const k of blocks) {
    if (k.dead) continue;
    k.y += k.vy * dt; k.flash = Math.max(0, k.flash - dt); k.pulse = Math.max(0, k.pulse - dt);
    if (k.y - k.h / 2 > DEFENSE_Y) { k.dead = true; popText(k.x, DEFENSE_Y - 20, '強化ロスト…', '#aaa', 20, 1); }
  }
  removeDead(blocks);

  // gates
  for (const g of gates) {
    if (g.dead) continue;
    g.y += g.vy * dt; g.flash = Math.max(0, g.flash - dt);
    if (!g.used && g.y >= PLAYER_Y) {
      // the player passes through whichever half they're in
      const inside = player.x >= g.x && player.x < g.x + g.w;
      gates.forEach(o => { if (o.gid === g.gid) o.used = true; });
      const chosen = inside ? g : gates.find(o => o.gid === g.gid && o !== g);
      if (chosen) applyGate(chosen);
    }
    if (g.y > H + 60) g.dead = true;
  }
  removeDead(gates);
}

function applyGate(g) {
  const v = g.v;
  if (g.key === 'ally') stats.allies = clamp(stats.allies + v, 0, 12);
  if (g.key === 'multi') stats.multi = clamp(stats.multi + v, 1, 9);
  if (g.key === 'power') stats.power = Math.max(1, stats.power + v);
  const good = v >= 0;
  const c = good ? '#33e08a' : '#ff4d6d';
  popText(player.x, PLAYER_Y - 50, g.unit + (good ? ' +' : ' ') + v, c, 30, 1.2);
  burst(player.x, PLAYER_Y - 10, c, 40, 320, 5);
  if (!good) { flash = 0.2; addShake(6); }
}

function killEnemy(e) {
  e.dead = true; kills++;
  score += e.score;
  burst(e.x, e.y, e.color, e.type === 'boss' ? 90 : 18, e.type === 'boss' ? 500 : 260, e.type === 'boss' ? 8 : 4.5);
  burst(e.x, e.y, '#ffffff', 6, 200, 3);
  popText(e.x, e.y, '+' + e.score, '#ffe14d', e.type === 'boss' ? 34 : 18, 0.8);
  addShake(e.type === 'boss' ? 14 : e.type === 'tank' ? 3 : 1.2);
  if (e.type === 'boss') { rings.push({ x: e.x, y: e.y, r: 20, life: 0.7, color: '#d9a7ff' }); spawnBlockAt(e.x, e.y); }
}
function spawnBlockAt(x, y) { spawnBlock(); const k = blocks[blocks.length - 1]; k.x = clamp(x, 70, W - 70); k.y = y; k.n = Math.ceil(k.n * 0.5); k.max = k.n; }

// ---------- drawing ----------
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2a1b5e'); g.addColorStop(0.5, '#1f3a7a'); g.addColorStop(1, '#2a7a8c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // scrolling road stripes
  const off = (time * 120) % 80;
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  for (let y = -80 + off; y < H; y += 80) { ctx.fillRect(W / 2 - 4, y, 8, 40); }
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.fillRect(20, 0, 4, H); ctx.fillRect(W - 24, 0, 4, H);
  // defense line
  ctx.strokeStyle = 'rgba(255,80,110,' + (0.45 + Math.sin(time * 6) * 0.2) + ')';
  ctx.lineWidth = 3; ctx.setLineDash([12, 10]);
  ctx.beginPath(); ctx.moveTo(0, DEFENSE_Y); ctx.lineTo(W, DEFENSE_Y); ctx.stroke(); ctx.setLineDash([]);
}

function drawSoldier(x, y, s, color, hurt) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(0, 22, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = hurt ? '#ffffff' : color;
  roundRect(-13, -6, 26, 26, 8); ctx.fill();
  ctx.fillStyle = '#ffd7a8'; ctx.beginPath(); ctx.arc(0, -14, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2b3a55'; ctx.beginPath(); ctx.arc(0, -17, 11, Math.PI, 0); ctx.fill(); ctx.fillRect(-11, -18, 22, 4);
  ctx.fillStyle = '#333'; ctx.fillRect(7, -26, 5, 22);
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  const f = e.flash > 0;
  if (e.type === 'boss') {
    ctx.fillStyle = f ? '#fff' : e.color;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + time; const r = i % 2 ? e.r * 0.8 : e.r; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff2d55'; ctx.beginPath(); ctx.arc(0, 0, e.r * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-12, -4, 7, 0, Math.PI * 2); ctx.arc(12, -4, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-12, -2, 3, 0, Math.PI * 2); ctx.arc(12, -2, 3, 0, Math.PI * 2); ctx.fill();
  } else {
    // blob monster
    const r = e.r, sq = 1 + Math.sin(e.wob * 2) * 0.06;
    ctx.scale(1 / sq, sq);
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(0, r * 0.9, r * 0.9, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = f ? '#ffffff' : e.color;
    ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, 0); ctx.lineTo(r, r * 0.7);
    for (let i = 0; i < 4; i++) { const x1 = r - (i + 0.5) * r / 2, x2 = r - (i + 1) * r / 2; ctx.quadraticCurveTo(x1, r * 1.05, x2, r * 0.7); }
    ctx.closePath(); ctx.fill();
    if (e.type === 'tank') { ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(-r * 0.7, -r * 0.2, r * 1.4, 5); }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.15, r * 0.25, 0, Math.PI * 2); ctx.arc(r * 0.35, -r * 0.15, r * 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-r * 0.32, -r * 0.08, r * 0.11, 0, Math.PI * 2); ctx.arc(r * 0.38, -r * 0.08, r * 0.11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-r * 0.55, -r * 0.5); ctx.lineTo(-r * 0.15, -r * 0.35); ctx.moveTo(r * 0.55, -r * 0.5); ctx.lineTo(r * 0.15, -r * 0.35); ctx.stroke();
  }
  ctx.restore();
  // HP label
  const w = Math.max(30, e.r * 1.6);
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(e.x - w / 2, e.y - e.r - 14, w, 5);
  ctx.fillStyle = '#ff3355'; ctx.fillRect(e.x - w / 2, e.y - e.r - 14, w * Math.max(0, e.hp) / e.maxHp, 5);
  ctx.font = 'bold ' + (e.type === 'boss' ? 22 : 14) + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(fmt(Math.max(0, e.hp)), e.x, e.y + (e.type === 'boss' ? e.r * 0.62 : 2));
  ctx.fillStyle = '#fff'; ctx.fillText(fmt(Math.max(0, e.hp)), e.x, e.y + (e.type === 'boss' ? e.r * 0.62 : 2));
}

function drawBlock(k) {
  const u = UPGRADES[k.key];
  const s = 1 + k.pulse * 0.8 + Math.sin(time * 5) * 0.02;
  ctx.save(); ctx.translate(k.x, k.y); ctx.scale(s, s);
  ctx.shadowColor = u.color; ctx.shadowBlur = 20;
  ctx.fillStyle = k.flash > 0 ? '#ffffff' : u.color;
  roundRect(-k.w / 2, -k.h / 2, k.w, k.h, 12); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
  // progress bar
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(-k.w / 2 + 8, k.h / 2 - 12, k.w - 16, 6);
  ctx.fillStyle = '#fff'; ctx.fillRect(-k.w / 2 + 8, k.h / 2 - 12, (k.w - 16) * (1 - k.n / k.max), 6);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 34px ' + FONT; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.strokeText(k.n, 0, -6); ctx.fillStyle = '#fff'; ctx.fillText(k.n, 0, -6);
  ctx.restore();
  // label tag above
  ctx.font = 'bold 15px ' + FONT; ctx.textAlign = 'center';
  const t = u.icon + ' ' + u.label, tw = ctx.measureText(t).width + 16;
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; roundRect(k.x - tw / 2, k.y - k.h / 2 - 28, tw, 22, 11); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(t, k.x, k.y - k.h / 2 - 17);
}

function drawGate(g) {
  const good = g.v >= 0;
  const c = good ? 'rgba(40,200,255,' : 'rgba(255,60,90,';
  ctx.fillStyle = c + (g.flash > 0 ? 0.75 : 0.45) + ')';
  ctx.fillRect(g.x + 4, g.y - g.h / 2, g.w - 8, g.h);
  ctx.fillStyle = good ? '#7ee8ff' : '#ff8fa3';
  ctx.fillRect(g.x + 4, g.y - g.h / 2, 6, g.h); ctx.fillRect(g.x + g.w - 10, g.y - g.h / 2, 6, g.h);
  ctx.font = 'bold 22px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const t = g.unit + ' ' + (good ? '+' : '') + g.v;
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(t, g.x + g.w / 2, g.y);
  ctx.fillStyle = '#fff'; ctx.fillText(t, g.x + g.w / 2, g.y);
}

function drawHUD() {
  // top bar
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, 64);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.font = 'bold 22px ' + FONT; ctx.fillStyle = '#ffe14d';
  ctx.fillText('スコア ' + score, 12, 20);
  ctx.font = 'bold 13px ' + FONT; ctx.fillStyle = '#cfe3ff';
  ctx.fillText('撃破 ' + kills + '   ' + Math.floor(time) + '秒', 12, 46);
  // hearts
  ctx.textAlign = 'right'; ctx.font = '20px ' + FONT;
  let hs = ''; for (let i = 0; i < stats.maxHp; i++) hs += i < stats.hp ? '❤' : '♡';
  ctx.fillStyle = '#ff4d6d'; ctx.fillText(hs, W - 10, 20);
  ctx.font = 'bold 12px ' + FONT; ctx.fillStyle = '#cfe3ff'; ctx.fillText('ベスト ' + best, W - 10, 46);
  // stats panel bottom
  const items = [
    ['発射', stats.multi, '#ff4fa3'], ['連射', stats.rate.toFixed(1), '#ffb321'], ['攻撃', stats.power, '#ff5a3c'],
    ['仲間', stats.allies, '#33d17a'], ['貫通', stats.pierce, '#3fa9ff'],
  ];
  const bw = (W - 12) / items.length;
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, H - 40, W, 40);
  items.forEach((it, i) => {
    const x = 6 + bw * i + bw / 2;
    ctx.textAlign = 'center'; ctx.font = 'bold 11px ' + FONT; ctx.fillStyle = it[2]; ctx.fillText(it[0], x, H - 29);
    ctx.font = 'bold 16px ' + FONT; ctx.fillStyle = '#fff'; ctx.fillText(String(it[1]), x, H - 12);
  });
}

function drawCenterText(lines) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const l of lines) {
    ctx.font = 'bold ' + l.size + 'px ' + FONT;
    ctx.lineWidth = l.size / 5; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText(l.t, W / 2, l.y);
    ctx.fillStyle = l.c || '#fff'; ctx.fillText(l.t, W / 2, l.y);
  }
}

function render() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  drawBackground();
  for (const g of gates) drawGate(g);
  for (const k of blocks) drawBlock(k);
  for (const e of enemies) drawEnemy(e);
  // bullets
  ctx.fillStyle = 'rgba(255,210,63,0.35)';
  for (const b of bullets) ctx.fillRect(b.x - 4, b.y - 9, 8, 20);
  ctx.fillStyle = '#fff6a8';
  for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 7, 4, 15);
  // player + allies
  if (state !== 'over') {
    for (let i = 0; i < stats.allies; i++) { const a = allyPos(i); drawSoldier(a.x, a.y, 0.62, '#33d17a', false); }
    const blink = player.hurt > 0 && Math.floor(player.hurt * 20) % 2 === 0;
    drawSoldier(player.x, PLAYER_Y, 1.15, '#3fa9ff', blink);
    if (fireT > 1 / stats.rate - 0.03) { ctx.fillStyle = '#fff3a0'; ctx.beginPath(); ctx.arc(player.x + 11, PLAYER_Y - 33, 6, 0, Math.PI * 2); ctx.fill(); }
  }
  for (const r of rings) { ctx.strokeStyle = r.color; ctx.globalAlpha = Math.max(0, r.life * 2); ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke(); }
  ctx.globalAlpha = 1;
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const a = Math.min(1, t.life / t.max * 2), sc = 1 + Math.max(0, (t.life / t.max - 0.8)) * 2;
    ctx.globalAlpha = a; ctx.font = 'bold ' + Math.round(t.size * sc) + 'px ' + FONT;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText(t.str, t.x, t.y);
    ctx.fillStyle = t.color; ctx.fillText(t.str, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = 'rgba(255,40,70,' + flash * 0.8 + ')'; ctx.fillRect(0, 0, W, H); }
  if (state === 'play' || state === 'over') drawHUD();
  if (banner && state === 'play') {
    ctx.globalAlpha = Math.min(1, banner.t * 2);
    ctx.fillStyle = 'rgba(120,0,40,0.75)'; ctx.fillRect(0, H * 0.32, W, 60);
    drawCenterText([{ t: banner.text, y: H * 0.32 + 30, size: 32, c: '#ffe14d' }]);
    ctx.globalAlpha = 1;
  }

  if (state === 'title') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
    const bob = Math.sin(performance.now() / 300) * 6;
    drawCenterText([
      { t: '撃って強化！', y: 210 + bob, size: 50, c: '#ffe14d' },
      { t: 'ラストシューター', y: 272 + bob, size: 40, c: '#ff4fa3' },
      { t: '降ってくる敵を撃ちまくれ！', y: 380, size: 20 },
      { t: '数字ブロックを撃って0にすると', y: 420, size: 18, c: '#9fe3ff' },
      { t: 'パワーアップ！', y: 448, size: 22, c: '#33e08a' },
      { t: 'ドラッグで左右に移動（自動射撃）', y: 500, size: 16, c: '#cfe3ff' },
    ]);
    if (Math.floor(performance.now() / 500) % 2 === 0) drawCenterText([{ t: 'タップしてスタート', y: 600, size: 28 }]);
    drawSoldier(W / 2, 700, 1.6, '#3fa9ff', false);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(0.65, overT) + ')'; ctx.fillRect(0, 0, W, H);
    const lines = [
      { t: 'ゲームオーバー', y: 240, size: 46, c: '#ff4d6d' },
      { t: 'スコア  ' + score, y: 330, size: 36, c: '#ffe14d' },
      { t: 'ベスト  ' + best, y: 380, size: 22 },
      { t: '撃破数 ' + kills + '　生存 ' + Math.floor(time) + '秒', y: 420, size: 18, c: '#cfe3ff' },
    ];
    if (score >= best && score > 0) lines.push({ t: '★ 新記録！ ★', y: 470, size: 26, c: '#33e08a' });
    drawCenterText(lines);
    if (overT > 0.6 && Math.floor(performance.now() / 500) % 2 === 0) drawCenterText([{ t: 'タップでリトライ', y: 580, size: 28 }]);
  }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// expose for automated testing
window.__game = { get state() { return state; }, get stats() { return stats; }, get score() { return score; },
  get counts() { return { enemies: enemies.length, blocks: blocks.length, gates: gates.length, bullets: bullets.length, particles: particles.length }; },
  targets() { return { e: enemies.map(o => [o.x, o.y]), k: blocks.map(o => [o.x, o.y]), px: player.x }; },
  skip(t) { time += t; gateT -= t; bossT -= t; } };
})();
</script>
</body>
</html>
