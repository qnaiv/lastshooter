<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>撃って強化！ラストシューター</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1e;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;box-shadow:0 0 40px rgba(0,0,0,.6);border-radius:6px;touch-action:none;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
'use strict';
const W = 450, H = 800;
const PLAYER_Y = H - 120;
const DEFENSE_Y = H - 80;
const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo","WenQuanYi Micro Hei","Droid Sans Fallback",sans-serif';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  scale = s;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.floor(W * s * dpr);
  cv.height = Math.floor(H * s * dpr);
}
window.addEventListener('resize', resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function removeDead(arr) { let j = 0; for (let i = 0; i < arr.length; i++) if (!arr[i].dead) arr[j++] = arr[i]; arr.length = j; }
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fmt(n) { return n >= 10000 ? (n / 1000).toFixed(1) + 'k' : String(Math.floor(n)); }

// ---------- weapons ----------
// Stats are global; each weapon reads them differently.
// Armor: dealt = max(1, raw - eff). MG/SG use full armor (spray chips and shows ブロック).
// Laser ignores 80% (eff = floor(armor*0.2)). Rocket ignores 60% (eff = floor(armor*0.4)).
const WEAPONS = {
  mg:     { name: 'マシンガン', color: '#ffe14a' },
  sg:     { name: 'ショットガン', color: '#ff9a3c' },
  laser:  { name: 'レーザー',   color: '#5cecff' },
  rocket: { name: 'ロケット',   color: '#ff5a2a' },
};
const WEAPON_IDS = ['mg', 'sg', 'laser', 'rocket'];

function mgDmg() { return 1 + Math.floor((stats.power - 1) * 0.4); }
function sgDmg() { return 3 + Math.floor(stats.power * 1.05); }
function sgRate() { return Math.max(0.8, stats.rate * 0.2); }
function laserTickDmg() {
  const base = 3 + stats.power * 0.75;
  const multiB = 1 + (stats.multi - 1) * 0.045;
  const pierceB = 1 + stats.pierce * 0.06;
  return Math.max(1, Math.round(base * multiB * pierceB));
}
function laserTicksPerSec() { return 9 + stats.rate * 0.3; }
function laserWidth() { return 11 + (stats.multi - 1) * 1.15; }
function rocketDmg() { return Math.max(1, Math.round((46 + stats.power * 16) * (1 + (stats.multi - 1) * 0.04))); }
function rocketRate() { return 0.42 + stats.rate * 0.045; }
function rocketSplash() { return 38 + stats.multi * 2 + stats.pierce * 4; }

function resolveHit(raw, armor, weapon) {
  const a = armor || 0;
  if (a <= 0) return { dmg: raw, blocked: false };
  let eff = a;
  if (weapon === 'laser') eff = Math.floor(a * 0.2);
  else if (weapon === 'rocket') eff = Math.floor(a * 0.4);
  if (raw <= eff) return { dmg: 1, blocked: true };
  return { dmg: raw - eff, blocked: false };
}

// ---------- upgrades ----------
const UPGRADES = {
  multi:  { label: '発射数 +1',  icon: '🔫', color: '#ff4fa3', apply: s => { s.multi = Math.min(s.multi + 1, 9); } },
  rate:   { label: '連射速度UP', icon: '⚡', color: '#ffb321', apply: s => { s.rate = Math.min(+(s.rate * 1.25).toFixed(3), 20); } },
  power:  { label: '攻撃力UP',   icon: '💥', color: '#ff5a3c', apply: s => { s.power += 1; } },
  ally:   { label: '仲間 +2',    icon: '👥', color: '#33d17a', apply: s => { s.allies = Math.min(s.allies + 2, 12); } },
  pierce: { label: '貫通 +1',    icon: '➶', color: '#3fa9ff', apply: s => { s.pierce = Math.min(s.pierce + 1, 5); } },
  heal:   { label: '体力回復',   icon: '❤', color: '#ff3b6b', apply: s => { s.hp = Math.min(s.hp + 1, s.maxHp); } },
};
const GATE_CAP = { ally: 6, power: 3, multi: 2 };
const UPG_KEYS = ['multi', 'rate', 'power', 'ally', 'pierce'];

// ---------- state ----------
let state = 'title';
let stats, player, bullets, ebullets, enemies, blocks, gates, particles, texts, rings;
let time, score, kills, spawnT, blockT, weaponT, gateT, bossT, eliteT, fireT, laserAcc, allyRocketAcc, allyCursor;
let shake, flash, best = 0, overT = 0, banner, keepAlive = false;
let introShooter = false, introArmor = false;
try { best = +localStorage.getItem('adShooterBest') || 0; } catch (e) {}

function reset() {
  stats = { multi: 1, rate: 7, power: 1, allies: 0, pierce: 0, hp: 5, maxHp: 5, weapon: 'mg' };
  player = { x: W / 2, tx: W / 2, hurt: 0 };
  bullets = []; ebullets = []; enemies = []; blocks = []; gates = []; particles = []; texts = []; rings = [];
  time = 0; score = 0; kills = 0;
  spawnT = 0.7; blockT = 3.2; weaponT = 8.5; gateT = 25; bossT = 45; eliteT = 52;
  fireT = 0; laserAcc = 0; allyRocketAcc = 0.4; allyCursor = 0;
  shake = 0; flash = 0; banner = null; overT = 0;
  introShooter = false; introArmor = false;
}
reset();

// ---------- input ----------
let dragging = false, lastPX = 0;
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toLogical(e);
  if (state === 'title') { state = 'play'; reset(); return; }
  if (state === 'over') { if (overT > 0.6) { state = 'play'; reset(); } return; }
  dragging = true; lastPX = p.x;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!dragging || state !== 'play') return;
  const p = toLogical(e);
  player.tx = clamp(player.tx + (p.x - lastPX) * 1.3, 24, W - 24);
  lastPX = p.x;
});
const endDrag = () => { dragging = false; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', e => {
  if (state !== 'play') { if (e.key === ' ' || e.key === 'Enter') { state = 'play'; reset(); } return; }
  if (e.key === 'ArrowLeft' || e.key === 'a') player.tx = clamp(player.tx - 40, 24, W - 24);
  if (e.key === 'ArrowRight' || e.key === 'd') player.tx = clamp(player.tx + 40, 24, W - 24);
});

// ---------- effects ----------
function burst(x, y, color, n, spd = 220, size = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(spd * 0.3, spd);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.7), max: 0.7, color, size: rand(size * 0.5, size * 1.3) });
  }
  if (particles.length > 600) particles.splice(0, particles.length - 600);
}
function popText(x, y, str, color = '#fff', size = 18, life = 0.7) {
  texts.push({ x, y, str, color, size, life, max: life, vy: -70 });
  if (texts.length > 80) texts.splice(0, texts.length - 80);
}
function addShake(v) { shake = Math.min(shake + v, 14); }

function linHp() { return 1 + time / 26; }
function rollHp(min, max, curve) { return Math.max(1, Math.round(rand(min, max) * (curve || linHp()))); }

function armorValue(rank) {
  // rank 0 soldier, 1 elite. Early armored enemies start at 5.
  const base = Math.min(14, 5 + Math.floor(Math.max(0, time - 25) / 22));
  if (rank === 1) return Math.min(18, base + 4);
  return base;
}
function bossArmor() {
  if (time < 75) return 0;
  return Math.min(9, 3 + Math.floor((time - 75) / 28));
}
function firingCount() {
  let n = 0;
  for (const e of enemies) if (!e.dead && e.fires && e.type !== 'boss' && e.type !== 'elite') n++;
  return n;
}
function aliveType(type) {
  for (const e of enemies) if (!e.dead && e.type === type) return true;
  return false;
}
function pickShooterPattern(t) {
  if (t < 32) return Math.random() < 0.55 ? 'aim1' : 'down1';
  if (t < 60) return pick(['aim1', 'aim3', 'down3']);
  if (t < 100) return pick(['aim3', 'spread5', 'down3', 'aim5']);
  return pick(['aim5', 'spread5', 'ring', 'aim3']);
}

// ---------- spawning ----------
function spawnEnemy(type, opts) {
  opts = opts || {};
  const dlin = linHp();
  let e;
  if (type === 'boss') {
    const hp = Math.round(820 * (1 + time / 48));
    e = { type, x: W / 2, y: -80, r: 52, hp, maxHp: hp, vy: 32, color: '#8e2de2', score: 800, wob: 0, armor: bossArmor(), fires: true, stopY: 158, atk: 'ring', atkT: 0.4, spin: rand(0, 6), volleys: 0 };
    banner = { text: '⚠ ボス出現！ ⚠', t: 2.1 };
  } else if (type === 'elite') {
    const hp = Math.round(780 * (1 + time / 55));
    const armor = armorValue(1);
    e = { type, x: rand(90, W - 90), y: -70, r: 40, hp, maxHp: hp, vy: 30, color: '#6e7788', score: 350, wob: Math.random() * 6, armor, fires: true, stopY: rand(150, 210), atk: 'volley', atkT: 0.3, spin: rand(0, 5), volleys: 0 };
    banner = { text: '⚠ 装甲ボス出現！ ⚠', t: 2.1 };
  } else if (type === 'armor') {
    const hp = Math.round(rand(110, 160) * (1 + time / 34));
    const fires = opts.fires != null ? opts.fires : (time > 32 && Math.random() < 0.6 && firingCount() < 6);
    e = { type, x: rand(46, W - 46), y: -44, r: 26, hp, maxHp: hp, vy: rand(26, 38), color: '#9aa3b5', score: 70, wob: Math.random() * 6, armor: armorValue(0), fires, stopY: rand(190, 340), pattern: fires ? pickShooterPattern(time) : null, fireT: rand(0.35, 0.9), hold: false };
  } else if (type === 'shooter') {
    if (firingCount() >= 6 && !opts.force) type = 'grunt';
  }
  if (type === 'shooter') {
    const hp = rollHp(16, 24, dlin);
    e = { type, x: rand(36, W - 36), y: -28, r: 17, hp, maxHp: hp, vy: rand(76, 102), color: '#ff3d8e', score: 35, wob: Math.random() * 6, armor: 0, fires: true, stopY: rand(155, 300), pattern: opts.pattern || pickShooterPattern(time), fireT: rand(0.28, 0.7), hold: false };
  } else if (type === 'tank') {
    const hp = rollHp(18, 26, dlin);
    e = { type, x: rand(50, W - 50), y: -40, r: 28, hp, maxHp: hp, vy: rand(30, 42), color: '#5a6bff', score: 40, wob: Math.random() * 6, armor: 0, fires: false };
  } else if (type === 'runner') {
    const hp = rollHp(2, 3.4, dlin);
    e = { type, x: rand(30, W - 30), y: -20, r: 14, hp, maxHp: hp, vy: rand(100, 132) + time * 0.25, color: '#ffd23f', score: 15, wob: Math.random() * 6, armor: 0, fires: false };
  } else if (type === 'grunt') {
    const hp = rollHp(3, 5, dlin);
    e = { type: 'grunt', x: rand(30, W - 30), y: -24, r: 18, hp, maxHp: hp, vy: rand(50, 70) + time * 0.22, color: '#ff4d4d', score: 10, wob: Math.random() * 6, armor: 0, fires: false };
  }
  if (!e) return null;
  e.flash = 0; e.blockCd = 0; e.numCd = 0; e.age = 0; e.dead = false;
  if (opts.x != null) e.x = opts.x;
  if (opts.y != null) e.y = opts.y;
  if (opts.stopY != null) e.stopY = opts.stopY;
  if (opts.pattern) e.pattern = opts.pattern;
  if (opts.fireT != null) e.fireT = opts.fireT;
  if (opts.armor != null) e.armor = opts.armor;
  enemies.push(e);
  return e;
}

function spawnWave() {
  if (time > 40 && Math.random() < 0.22) {
    const n = randi(3, Math.min(5, 2 + Math.floor(time / 45)));
    const gap = (W - 70) / Math.max(n - 1, 1);
    const pat = time > 95 ? pick(['aim5', 'spread5', 'ring']) : pick(['aim3', 'down3', 'spread5']);
    for (let i = 0; i < n; i++) {
      spawnEnemy('shooter', { force: i < 4, x: 36 + gap * i, y: -24 - (i % 2) * 26, stopY: rand(150, 250), pattern: pat, fireT: 0.35 + i * 0.12 });
    }
    return;
  }
  const n = Math.min(1 + Math.floor(time / 15), 7);
  if (Math.random() < 0.3) {
    const gap = (W - 60) / Math.max(n - 1, 1);
    for (let i = 0; i < n; i++) {
      spawnEnemy(time > 15 && Math.random() < 0.25 ? 'shooter' : 'grunt', { x: 30 + gap * i, y: -24 - (i % 2) * 16 });
    }
    return;
  }
  let armorN = 0;
  for (let i = 0; i < n; i++) {
    let type = rollEnemyType();
    if (type === 'armor' && ++armorN > 2) type = 'grunt';
    spawnEnemy(type, { y: -24 - rand(0, 100) });
  }
}
function rollEnemyType() {
  if (time < 8) return Math.random() < 0.22 ? 'runner' : 'grunt';
  const r = Math.random();
  const shooterP = time < 15 ? 0 : Math.min(0.34, 0.14 + (time - 15) / 170);
  const armorP = time < 25 ? 0 : Math.min(0.28, 0.1 + (time - 25) / 190);
  const tankP = time < 18 ? 0 : 0.1;
  const runnerP = 0.18;
  if (r < armorP) return 'armor';
  if (r < armorP + shooterP) return 'shooter';
  if (r < armorP + shooterP + tankP) return 'tank';
  if (r < armorP + shooterP + tankP + runnerP) return 'runner';
  return 'grunt';
}
function spawnBlock() {
  const key = stats.hp < 3 && Math.random() < 0.35 ? 'heal' : pick(UPG_KEYS);
  const base = 14 + Math.floor(time / 6) * 3;
  const n = clamp(randi(base, base + 18), 12, 70 + Math.floor(time / 3));
  blocks.push({ kind: 'upgrade', key, x: rand(70, W - 70), y: -50, w: 110, h: 70, n, max: n, vy: 46 + Math.min(time * 0.18, 28), flash: 0, pulse: 0, dead: false, laserCd: 0 });
}
function spawnWeaponBlock() {
  const options = WEAPON_IDS.filter(id => id !== stats.weapon);
  const key = pick(options);
  const n = clamp(14 + Math.floor(time / 5) * 2, 14, 46);
  blocks.push({ kind: 'weapon', key, x: rand(80, W - 80), y: -64, w: 136, h: 78, n, max: n, vy: 40 + Math.min(time * 0.14, 22), flash: 0, pulse: 0, dead: false, laserCd: 0 });
}
function spawnGates() {
  const opts = [
    { key: 'ally', v: randi(1, 3), unit: '仲間' },
    { key: 'multi', v: 1, unit: '発射数' },
    { key: 'power', v: randi(1, 2), unit: '攻撃力' },
  ];
  const good = pick(opts);
  const bad = { key: pick(['ally', 'power']), v: -randi(2, 5) };
  bad.unit = bad.key === 'ally' ? '仲間' : '攻撃力';
  const pair = Math.random() < 0.5 ? [good, bad] : [bad, good];
  const gid = Math.random();
  pair.forEach((g, i) => gates.push({ gid, x: i === 0 ? 0 : W / 2, y: -60, w: W / 2, h: 46, key: g.key, v: g.v, unit: g.unit, acc: 0, vy: 60, used: false, dead: false, flash: 0, laserCd: 0 }));
}
function spawnBlockAt(x, y) {
  if (Math.random() < 0.45) spawnWeaponBlock(); else spawnBlock();
  const k = blocks[blocks.length - 1];
  k.x = clamp(x, 80, W - 80); k.y = y;
  k.n = Math.max(8, Math.ceil(k.n * 0.45)); k.max = k.n;
}

// ---------- enemy bullets ----------
function emitDir(x, y, ang, spd) {
  if (ebullets.length > 380) return;
  ebullets.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 6.2, dead: false });
}
function emitAim(x, y, n, spread, spd) {
  const ang = Math.atan2(PLAYER_Y - y, player.x - x);
  for (let i = 0; i < n; i++) emitDir(x, y, ang + (i - (n - 1) / 2) * spread, spd);
}
function emitDown(x, y, n, spread, spd) {
  for (let i = 0; i < n; i++) emitDir(x, y, Math.PI / 2 + (i - (n - 1) / 2) * spread, spd);
}
function emitRing(x, y, rot, n, spd) {
  for (let i = 0; i < n; i++) emitDir(x, y, rot + (i / n) * Math.PI * 2, spd);
}
function emitPattern(e, pattern) {
  const spd = 150 + Math.min(105, time * 0.48);
  const x = e.x, y = e.y + e.r * 0.25;
  if (pattern === 'down1') emitDown(x, y, 1, 0, spd);
  else if (pattern === 'down3') emitDown(x, y, 3, 0.24, spd);
  else if (pattern === 'spread5') emitDown(x, y, 5, 0.2, spd * 0.96);
  else if (pattern === 'aim3') emitAim(x, y, 3, 0.2, spd);
  else if (pattern === 'aim5') emitAim(x, y, 5, 0.16, spd);
  else if (pattern === 'ring') { emitRing(x, y, e.spin || 0, 8, spd * 0.74); e.spin = (e.spin || 0) + 0.28; }
  else emitAim(x, y, 1, 0, spd);
}
function updateEnemyFire(e, dt) {
  if (e.y < 36 || e.y > DEFENSE_Y - 30) return;
  if (e.type === 'boss' || e.type === 'elite') { updateBigFire(e, dt); return; }
  e.fireT -= dt;
  if (e.fireT > 0) return;
  emitPattern(e, e.pattern || 'aim1');
  if (time > 70 && Math.random() < 0.28) e.pattern = pickShooterPattern(time);
  e.fireT = Math.max(0.46, 1.9 - time * 0.01);
}
function updateBigFire(e, dt) {
  e.atkT -= dt;
  if (e.atkT <= 0) {
    e.atk = e.type === 'boss' ? pick(['ring', 'volley', 'spiral']) : pick(['ring', 'volley', 'spread']);
    e.atkT = e.atk === 'spiral' ? 2.3 : 2.1;
    e.fireT = 0.18;
    e.volleys = 0;
    e.spin = e.spin || rand(0, 6);
  }
  e.fireT -= dt;
  if (e.fireT > 0) return;
  const spd = 138 + Math.min(100, time * 0.38);
  if (e.atk === 'ring') {
    emitRing(e.x, e.y + 6, e.spin || 0, e.type === 'boss' ? 16 : 12, spd * 0.76);
    e.spin = (e.spin || 0) + 0.22;
    e.fireT = e.type === 'boss' ? Math.max(0.85, 1.25 - time * 0.002) : 1.2;
  } else if (e.atk === 'volley') {
    emitAim(e.x, e.y + 8, e.type === 'boss' ? 5 : 4, 0.17, spd);
    e.volleys = (e.volleys || 0) + 1;
    e.fireT = 0.4;
    if (e.volleys >= 3) e.atkT = 0;
  } else if (e.atk === 'spiral') {
    e.spin = (e.spin || 0) + 0.4;
    emitDir(e.x, e.y, e.spin, spd * 0.68);
    emitDir(e.x, e.y, e.spin + Math.PI, spd * 0.68);
    e.fireT = 0.09;
  } else {
    emitDown(e.x, e.y + 8, 7, 0.16, spd * 0.84);
    e.fireT = 0.82;
  }
}

// ---------- player weapons ----------
function allyPos(i) {
  const side = i % 2 === 0 ? -1 : 1, rank = Math.floor(i / 2);
  const row = rank < 3 ? 0 : 1, col = rank % 3;
  const x = player.x + side * (row === 0 ? 32 + col * 22 : 18 + col * 22);
  return { x: clamp(x, 12, W - 12), y: PLAYER_Y + 8 + row * 24 + col * 3 };
}
function pushShot(o) {
  bullets.push(o);
  if (bullets.length > 900) bullets.splice(0, bullets.length - 900);
}
function fireFan(x, y, count, step, speed, dmg, range, pierce, kind, weapon) {
  for (let i = 0; i < count; i++) {
    const a = (i - (count - 1) / 2) * step;
    pushShot({
      x: x + (i - (count - 1) / 2) * 5, y, vx: Math.sin(a) * speed, vy: -Math.cos(a) * speed,
      dmg, pierce, range, traveled: 0, kind, weapon, hit: null, gates: null, dead: false, splash: 0,
    });
  }
}
function fireRocketAt(x, y, dmg, splash, speed, big) {
  pushShot({
    x, y, vx: 0, vy: -speed, dmg, pierce: 0, range: 1400, traveled: 0,
    kind: 'rocket', weapon: 'rocket', hit: null, gates: null, dead: false, splash, big: !!big,
  });
}
function pelletRaw(b) {
  if (b.kind !== 'pellet' || !b.range) return b.dmg;
  const t = b.traveled / b.range;
  const mul = t <= 0.38 ? 1 : Math.max(0.35, 1 - (t - 0.38) * 1.05);
  return Math.max(1, Math.round(b.dmg * mul));
}
function firePlayerWeapons(dt) {
  const w = stats.weapon;
  if (w === 'laser') {
    laserAcc += dt;
    const interval = 1 / laserTicksPerSec();
    let guard = 0;
    while (laserAcc >= interval && guard++ < 4) {
      laserAcc -= interval;
      pulseLaser(player.x, PLAYER_Y - 20, laserWidth(), laserTickDmg(), true);
      const allyD = Math.max(1, Math.round(laserTickDmg() * 0.14));
      for (let i = 0; i < stats.allies; i++) {
        const a = allyPos(i);
        pulseLaser(a.x, a.y - 12, 4.5, allyD, false);
      }
    }
    return;
  }
  fireT -= dt;
  const interval = w === 'sg' ? 1 / sgRate() : w === 'rocket' ? 1 / rocketRate() : 1 / stats.rate;
  if (fireT <= 0) {
    fireT += interval;
    if (fireT < 0) fireT = 0;
    if (w === 'mg') {
      fireFan(player.x, PLAYER_Y - 26, stats.multi, 0.085, 800, mgDmg(), 1300, stats.pierce, 'mg', 'mg');
      const ad = Math.max(1, Math.round(mgDmg() * 0.5));
      for (let i = 0; i < stats.allies; i++) {
        const a = allyPos(i);
        fireFan(a.x, a.y - 14, 1, 0, 800, ad, 1300, Math.max(0, stats.pierce - 1), 'mg', 'mg');
      }
    } else if (w === 'sg') {
      const n = 6 + stats.multi;
      const step = n <= 1 ? 0 : 1.05 / (n - 1);
      fireFan(player.x, PLAYER_Y - 22, n, step, 700, sgDmg(), 300, Math.min(2, stats.pierce), 'pellet', 'sg');
      const ad = Math.max(1, Math.round(sgDmg() * 0.4));
      for (let i = 0; i < stats.allies; i++) {
        const a = allyPos(i);
        fireFan(a.x, a.y - 12, 3, 0.22, 680, ad, 210, 0, 'pellet', 'sg');
      }
    } else if (w === 'rocket') {
      fireRocketAt(player.x, PLAYER_Y - 28, rocketDmg(), rocketSplash(), 280, true);
    }
  }
  if (w === 'rocket' && stats.allies > 0) {
    allyRocketAcc += dt;
    const every = Math.max(0.22, 0.9 - stats.allies * 0.045);
    if (allyRocketAcc >= every) {
      allyRocketAcc = 0;
      const i = allyCursor % stats.allies;
      allyCursor++;
      const a = allyPos(i);
      fireRocketAt(a.x, a.y - 14, Math.max(8, Math.round(rocketDmg() * 0.2)), 18, 300, false);
    }
  }
}

function applyDamage(e, raw, weapon, x, y, quiet) {
  if (!e || e.dead) return;
  const hit = resolveHit(Math.max(1, raw | 0), e.armor || 0, weapon);
  e.hp -= hit.dmg;
  e.flash = 0.07;
  if (hit.blocked) {
    burst(x, y, '#e6edf7', 4, 110, 2.4);
    if (!e.blockCd) {
      popText(e.x + rand(-6, 6), e.y - e.r - 2, 'ブロック', '#d7e3f4', 15, 0.48);
      e.blockCd = 0.32;
    }
  } else if (!quiet) {
    const big = weapon === 'rocket' || hit.dmg >= 24;
    if (big || !e.numCd) {
      popText(e.x + rand(-8, 8), e.y - e.r, String(hit.dmg), big ? '#ffd0a6' : '#fff', big ? 22 : 14, big ? 0.6 : 0.45);
      if (!big) e.numCd = 0.14;
    }
    if (big) burst(x, y, '#ffd7a8', 6, 150, 3);
  }
  if (e.hp <= 0) killEnemy(e);
}

function pulseLaser(x, y0, width, dmg, heavy) {
  const half = width / 2;
  for (const g of gates) {
    if (g.dead || g.used || g.laserCd > 0) continue;
    if (x >= g.x && x < g.x + g.w && g.y < y0 && g.y > -20) {
      g.laserCd = 0.1;
      bumpGate(g, x);
    }
  }
  for (const k of blocks) {
    if (k.dead || k.laserCd > 0) continue;
    if (Math.abs(k.x - x) < k.w / 2 + half && k.y < y0 && k.y > -40) {
      k.laserCd = heavy ? 0.08 : 0.12;
      hitBlock(k, 1, x, k.y);
    }
  }
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.y > y0 + 6) continue;
    if (Math.abs(e.x - x) <= half + e.r * 0.55) applyDamage(e, dmg, 'laser', x, e.y, !heavy);
  }
}

function bumpGate(g, x) {
  g.acc += 1; g.flash = 0.05;
  const need = g.v < 0 ? 4 : 20, cap = GATE_CAP[g.key];
  if (g.acc >= need && g.v < cap) { g.acc = 0; g.v += 1; popText(x, g.y, '+1', '#9fffd0', 16, 0.5); }
}
function hitBlock(k, amount, x, y) {
  k.n -= amount; k.flash = 0.06; k.pulse = 0.12;
  const col = k.kind === 'weapon' ? WEAPONS[k.key].color : UPGRADES[k.key].color;
  burst(x, y, col, 2, 120, 3);
  if (k.n <= 0) {
    k.dead = true;
    if (k.kind === 'weapon') applyWeapon(k.key, k.x, k.y);
    else applyUpgrade(k.key, k.x, k.y);
    score += k.kind === 'weapon' ? 40 : 50;
  }
}
function explodeRocket(b, primary) {
  const r = b.splash || 0;
  burst(b.x, b.y, b.big ? '#ff7a3c' : '#ffb07a', b.big ? 26 : 10, b.big ? 260 : 160, b.big ? 5 : 3);
  burst(b.x, b.y, '#ffe14a', b.big ? 10 : 4, 140, 2.5);
  rings.push({ x: b.x, y: b.y, r: 6, life: b.big ? 0.38 : 0.22, color: '#ffb15a' });
  if (b.big) addShake(3.5);
  if (r > 0) {
    for (const e of enemies) {
      if (e.dead || e === primary) continue;
      const dx = e.x - b.x, dy = e.y - b.y;
      if (dx * dx + dy * dy <= (r + e.r * 0.6) * (r + e.r * 0.6)) {
        applyDamage(e, Math.max(1, Math.round(b.dmg * (b.big ? 0.48 : 0.4))), 'rocket', e.x, e.y, !b.big);
      }
    }
  }
  b.dead = true;
}

function hurtPlayer(amount) {
  if (state !== 'play') return;
  if (player.hurt > 0) return;
  stats.hp -= amount;
  player.hurt = 0.8;
  flash = 0.4;
  addShake(amount >= 3 ? 12 : 8);
  popText(player.x, PLAYER_Y - 46, '-' + amount + ' HP', '#ff4060', 26, 1);
  if (stats.hp <= 0) {
    if (keepAlive) { stats.hp = stats.maxHp; return; }
    stats.hp = 0; state = 'over'; overT = 0;
    burst(player.x, PLAYER_Y, '#ffffff', 60, 400, 6);
    if (score > best) { best = score; try { localStorage.setItem('adShooterBest', best); } catch (e) {} }
  }
}
function killAllyAt(x, y) {
  if (stats.allies <= 0) return false;
  let hit = -1, bestD = 1e9;
  for (let i = 0; i < stats.allies; i++) {
    const a = allyPos(i);
    const dx = x - a.x, dy = y - a.y, d = dx * dx + dy * dy;
    const rad = 12 + 6;
    if (d < rad * rad && d < bestD) { bestD = d; hit = i; }
  }
  if (hit < 0) return false;
  const a = allyPos(hit);
  stats.allies--;
  burst(a.x, a.y, '#33d17a', 18, 220, 4);
  popText(a.x, a.y - 18, '仲間やられた', '#b8ffd4', 16, 0.8);
  return true;
}

function applyUpgrade(key, x, y) {
  const u = UPGRADES[key];
  u.apply(stats);
  popText(x, y - 10, u.label + '！', u.color, 28, 1.2);
  burst(x, y, u.color, 46, 360, 6); burst(x, y, '#ffffff', 16, 240, 3);
  rings.push({ x, y, r: 10, life: 0.45, color: u.color });
  addShake(5);
}
function applyWeapon(id, x, y) {
  stats.weapon = id;
  fireT = 0.12; laserAcc = 0;
  const w = WEAPONS[id];
  popText(x, y - 14, w.name + '装備！', w.color, 28, 1.25);
  banner = { text: w.name + ' に持ち替え！', t: 1.5 };
  burst(x, y, w.color, 48, 380, 6);
  rings.push({ x, y, r: 12, life: 0.45, color: w.color });
  addShake(5);
}
function applyGate(g) {
  const v = g.v;
  if (g.key === 'ally') stats.allies = clamp(stats.allies + v, 0, 12);
  if (g.key === 'multi') stats.multi = clamp(stats.multi + v, 1, 9);
  if (g.key === 'power') stats.power = Math.max(1, stats.power + v);
  const good = v >= 0;
  const c = good ? '#33e08a' : '#ff4d6d';
  popText(player.x, PLAYER_Y - 50, g.unit + (good ? ' +' : ' ') + v, c, 30, 1.2);
  burst(player.x, PLAYER_Y - 10, c, 40, 320, 5);
  if (!good) { flash = 0.2; addShake(6); }
}
function killEnemy(e) {
  if (e.dead) return;
  e.dead = true; kills++;
  score += e.score;
  const big = e.type === 'boss' || e.type === 'elite';
  burst(e.x, e.y, e.color, big ? 80 : 16, big ? 480 : 250, big ? 7 : 4);
  burst(e.x, e.y, '#ffffff', 6, 180, 3);
  popText(e.x, e.y, '+' + e.score, '#ffe14d', big ? 32 : 18, 0.8);
  addShake(e.type === 'boss' ? 14 : e.type === 'elite' ? 8 : e.type === 'armor' || e.type === 'tank' ? 3 : 1.1);
  if (e.type === 'boss' || e.type === 'elite') {
    rings.push({ x: e.x, y: e.y, r: 18, life: 0.65, color: e.type === 'boss' ? '#d9a7ff' : '#d5deea' });
    spawnBlockAt(e.x, e.y);
  }
}
function bodyDamage(e) {
  if (e.type === 'boss') return 5;
  if (e.type === 'elite') return 3;
  if (e.type === 'armor' || e.type === 'tank') return 2;
  return 1;
}

// ---------- update ----------
function update(dt) {
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  shake = Math.max(0, shake - dt * 30);
  flash = Math.max(0, flash - dt);
  for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy = p.vy * 0.92 + 300 * dt; if (p.life <= 0) p.dead = true; }
  removeDead(particles);
  for (const t of texts) { t.life -= dt; t.y += t.vy * dt; t.vy *= 0.94; if (t.life <= 0) t.dead = true; }
  removeDead(texts);
  for (const r of rings) { r.life -= dt; r.r += 420 * dt; if (r.life <= 0) r.dead = true; }
  removeDead(rings);
  if (state === 'over') { overT += dt; return; }
  if (state !== 'play') return;

  time += dt;
  player.x += (player.tx - player.x) * Math.min(1, dt * 18);
  player.hurt = Math.max(0, player.hurt - dt);

  if (!introShooter && time >= 15) {
    introShooter = true;
    spawnEnemy('shooter', { force: true, x: W * 0.3, y: -20, stopY: 200, pattern: 'aim3', fireT: 0.45 });
    spawnEnemy('shooter', { force: true, x: W * 0.7, y: -36, stopY: 250, pattern: 'down3', fireT: 0.7 });
  }
  if (!introArmor && time >= 25) {
    introArmor = true;
    spawnEnemy('armor', { x: W * 0.5, y: -30, fires: true, pattern: 'aim3', fireT: 0.55, armor: 5, stopY: 230 });
  }

  spawnT -= dt;
  if (spawnT <= 0) { spawnWave(); spawnT = Math.max(0.72, 2.45 - time * 0.016); }
  blockT -= dt;
  if (blockT <= 0) { spawnBlock(); blockT = rand(6.2, 9.2); }
  weaponT -= dt;
  if (weaponT <= 0) { spawnWeaponBlock(); weaponT = rand(13, 19); }
  gateT -= dt;
  if (gateT <= 0) { spawnGates(); gateT = rand(22, 30); }
  bossT -= dt;
  if (bossT <= 0) {
    if (aliveType('boss')) bossT = 8;
    else { spawnEnemy('boss'); bossT = 62; }
  }
  eliteT -= dt;
  if (eliteT <= 0) {
    if (time < 50 || aliveType('elite')) eliteT = 6;
    else { spawnEnemy('elite'); eliteT = rand(34, 46); }
  }

  firePlayerWeapons(dt);

  for (const b of bullets) {
    if (b.dead) continue;
    const step = Math.hypot(b.vx, b.vy) * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.traveled += step;
    if (b.y < -30 || b.x < -30 || b.x > W + 30 || (b.range && b.traveled >= b.range)) { b.dead = true; continue; }
    // Gates stay permeable: a projectile ticks each gate once, then flies on.
    for (const g of gates) {
      if (g.dead || g.used || (b.gates && b.gates.has(g))) continue;
      if (b.x >= g.x && b.x < g.x + g.w && b.y > g.y - g.h / 2 && b.y < g.y + g.h / 2) {
        (b.gates || (b.gates = new Set())).add(g);
        bumpGate(g, b.x);
      }
    }
    for (const k of blocks) {
      if (k.dead || b.dead) continue;
      if (b.x > k.x - k.w / 2 && b.x < k.x + k.w / 2 && b.y > k.y - k.h / 2 && b.y < k.y + k.h / 2) {
        const amount = b.kind === 'rocket' ? (b.big ? 8 : 3) : 1;
        hitBlock(k, amount, b.x, b.y);
        if (b.kind === 'rocket') explodeRocket(b, null);
        else b.dead = true;
        break;
      }
    }
    if (b.dead) continue;
    for (const e of enemies) {
      if (e.dead) continue;
      if (b.hit && b.hit.has(e)) continue;
      const dx = b.x - e.x, dy = b.y - e.y;
      const rad = e.r + (b.kind === 'rocket' ? 12 : 4);
      if (dx * dx + dy * dy < rad * rad) {
        const raw = pelletRaw(b);
        if (b.kind === 'rocket') {
          applyDamage(e, raw, 'rocket', b.x, b.y, false);
          explodeRocket(b, e);
          break;
        }
        applyDamage(e, raw, b.weapon, b.x, b.y, false);
        if (b.pierce > 0) { b.pierce--; (b.hit || (b.hit = new Set())).add(e); }
        else { b.dead = true; break; }
      }
    }
  }
  removeDead(bullets);

  for (const e of enemies) {
    if (e.dead) continue;
    e.wob += dt * 4;
    e.flash = Math.max(0, e.flash - dt);
    e.blockCd = Math.max(0, e.blockCd - dt);
    e.numCd = Math.max(0, e.numCd - dt);
    e.age += dt;
    if (e.type === 'boss' || e.type === 'elite') {
      const hover = e.stopY || 160;
      const enrageAt = e.type === 'boss' ? 26 : 20;
      if (!e.enrage && e.age > enrageAt) e.enrage = true;
      if (e.y < hover) { e.y += e.vy * dt; if (e.y > hover) e.y = hover; }
      else if (!e.enrage) e.y = hover + Math.sin(time * 1.05 + e.age) * 16;
      else e.y += 28 * dt;
      const amp = e.type === 'boss' ? 128 : 96;
      e.x = clamp(W / 2 + Math.sin(time * 0.78 + e.age) * amp, e.r + 8, W - e.r - 8);
    } else if (e.fires && e.stopY) {
      if (!e.hold && e.y >= e.stopY) { e.hold = true; e.vy = rand(8, 16); }
      e.y += e.vy * dt;
      e.x = clamp(e.x + Math.sin(e.wob) * (e.hold ? 34 : 16) * dt, 20, W - 20);
    } else {
      e.y += e.vy * dt;
      e.x = clamp(e.x + Math.sin(e.wob) * 20 * dt, 16, W - 16);
    }
    if (e.fires) updateEnemyFire(e, dt);
    if (e.dead) continue;
    if (e.y + e.r * 0.45 > DEFENSE_Y) {
      e.dead = true;
      burst(e.x, DEFENSE_Y, e.color, 22, 240, 5);
      hurtPlayer(bodyDamage(e));
      if (state !== 'play') return;
    }
  }
  removeDead(enemies);

  for (const b of ebullets) {
    if (b.dead) continue;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 36 || b.y < -60 || b.x < -40 || b.x > W + 40) { b.dead = true; continue; }
    const pdx = b.x - player.x, pdy = b.y - PLAYER_Y;
    const pr = 16 + b.r;
    if (pdx * pdx + pdy * pdy < pr * pr) {
      b.dead = true;
      burst(b.x, b.y, '#ff4b8a', 12, 180, 3.2);
      if (player.hurt <= 0) {
        hurtPlayer(1);
        if (state !== 'play') return;
      }
      continue;
    }
    if (stats.allies > 0 && killAllyAt(b.x, b.y)) b.dead = true;
  }
  removeDead(ebullets);

  for (const k of blocks) {
    if (k.dead) continue;
    k.y += k.vy * dt;
    k.flash = Math.max(0, k.flash - dt);
    k.pulse = Math.max(0, k.pulse - dt);
    k.laserCd = Math.max(0, (k.laserCd || 0) - dt);
    if (k.y - k.h / 2 > DEFENSE_Y) {
      k.dead = true;
      popText(k.x, DEFENSE_Y - 20, k.kind === 'weapon' ? '武器ロスト…' : '強化ロスト…', '#aaa', 20, 1);
    }
  }
  removeDead(blocks);

  for (const g of gates) {
    if (g.dead) continue;
    g.y += g.vy * dt;
    g.flash = Math.max(0, g.flash - dt);
    g.laserCd = Math.max(0, (g.laserCd || 0) - dt);
    if (!g.used && g.y >= PLAYER_Y) {
      const inside = player.x >= g.x && player.x < g.x + g.w;
      gates.forEach(o => { if (o.gid === g.gid) o.used = true; });
      const chosen = inside ? g : gates.find(o => o.gid === g.gid && o !== g);
      if (chosen) applyGate(chosen);
    }
    if (g.y > H + 60) g.dead = true;
  }
  removeDead(gates);
}

// ---------- drawing ----------
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2a1b5e'); g.addColorStop(0.5, '#1f3a7a'); g.addColorStop(1, '#2a7a8c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const off = (time * 120) % 80;
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  for (let y = -80 + off; y < H; y += 80) ctx.fillRect(W / 2 - 4, y, 8, 40);
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.fillRect(20, 0, 4, H); ctx.fillRect(W - 24, 0, 4, H);
  ctx.strokeStyle = 'rgba(255,80,110,' + (0.45 + Math.sin(time * 6) * 0.2) + ')';
  ctx.lineWidth = 3; ctx.setLineDash([12, 10]);
  ctx.beginPath(); ctx.moveTo(0, DEFENSE_Y); ctx.lineTo(W, DEFENSE_Y); ctx.stroke(); ctx.setLineDash([]);
}
function drawSoldier(x, y, s, color, hurt) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(0, 22, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = hurt ? '#ffffff' : color;
  roundRect(-13, -6, 26, 26, 8); ctx.fill();
  ctx.fillStyle = '#ffd7a8'; ctx.beginPath(); ctx.arc(0, -14, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2b3a55'; ctx.beginPath(); ctx.arc(0, -17, 11, Math.PI, 0); ctx.fill(); ctx.fillRect(-11, -18, 22, 4);
  ctx.fillStyle = '#333'; ctx.fillRect(7, -26, 5, 22);
  ctx.restore();
}
function drawShield(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#d5deea';
  ctx.beginPath();
  ctx.moveTo(0, -1.15); ctx.lineTo(0.95, -0.7); ctx.lineTo(0.8, 0.35); ctx.quadraticCurveTo(0, 1.15, -0.8, 0.35); ctx.lineTo(-0.95, -0.7); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#5c6b80';
  ctx.fillRect(-0.45, -0.15, 0.9, 0.28);
  ctx.restore();
}
function drawWeaponIcon(id, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (id === 'mg') {
    ctx.strokeStyle = '#ffe14a'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 4, 6); ctx.lineTo(i * 5.2, -8); ctx.stroke(); }
  } else if (id === 'sg') {
    ctx.strokeStyle = '#ff9a3c'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    for (let i = -2; i <= 2; i++) {
      const a = i * 0.32;
      ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(Math.sin(a) * 11, -Math.cos(a) * 11); ctx.stroke();
    }
  } else if (id === 'laser') {
    ctx.fillStyle = 'rgba(150, 245, 255, 0.45)'; ctx.fillRect(-4, -12, 8, 24);
    ctx.fillStyle = '#e9fdff'; ctx.fillRect(-1.4, -13, 2.8, 26);
  } else {
    ctx.fillStyle = '#ff5a2a';
    ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(6, 7); ctx.lineTo(-6, 7); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffe14a'; ctx.fillRect(-2, 7, 4, 5);
  }
  ctx.restore();
  ctx.lineCap = 'butt';
}
function drawBlob(e, metal, barrel) {
  const r = e.r, sq = 1 + Math.sin(e.wob * 2) * 0.06;
  ctx.save();
  ctx.scale(1 / sq, sq);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0, r * 0.9, r * 0.9, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.color;
  ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, 0); ctx.lineTo(r, r * 0.7);
  for (let i = 0; i < 4; i++) { const x1 = r - (i + 0.5) * r / 2, x2 = r - (i + 1) * r / 2; ctx.quadraticCurveTo(x1, r * 1.05, x2, r * 0.7); }
  ctx.closePath(); ctx.fill();
  if (metal) {
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#f4f7fb';
    ctx.beginPath(); ctx.ellipse(-r * 0.28, -r * 0.42, r * 0.38, r * 0.2, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.lineWidth = 3; ctx.strokeStyle = e.flash > 0 ? '#fff' : '#e7eef8';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.92, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
  }
  if (e.type === 'tank') { ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(-r * 0.7, -r * 0.2, r * 1.4, 5); }
  if (barrel) {
    ctx.fillStyle = '#2a1020';
    ctx.fillRect(-4, r * 0.15, 8, r * 0.95);
    ctx.fillStyle = '#ffd0e6';
    ctx.fillRect(-2, r * 0.85, 4, 5);
  }
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-r * 0.32, -r * 0.12, r * 0.22, 0, Math.PI * 2); ctx.arc(r * 0.32, -r * 0.12, r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-r * 0.28, -r * 0.06, r * 0.09, 0, Math.PI * 2); ctx.arc(r * 0.36, -r * 0.06, r * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  const f = e.flash > 0;
  if (e.type === 'boss') {
    ctx.fillStyle = f ? '#fff' : e.color;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + time; const r = i % 2 ? e.r * 0.8 : e.r; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff2d55'; ctx.beginPath(); ctx.arc(0, 0, e.r * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-12, -4, 7, 0, Math.PI * 2); ctx.arc(12, -4, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-12, -2, 3, 0, Math.PI * 2); ctx.arc(12, -2, 3, 0, Math.PI * 2); ctx.fill();
  } else if (e.type === 'elite') {
    drawBlob(e, true, false);
    ctx.fillStyle = f ? '#fff' : '#c5d0de';
    ctx.beginPath(); ctx.arc(0, 2, e.r * 0.42, 0, Math.PI * 2); ctx.fill();
    drawShield(0, 2, e.r * 0.28);
  } else {
    drawBlob(e, e.type === 'armor', e.type === 'shooter' || (e.type === 'armor' && e.fires));
    if (e.type === 'armor') drawShield(0, -e.r * 0.02, e.r * 0.34);
  }
  ctx.restore();
  if (e.fires && e.fireT > 0 && e.fireT < 0.16 && e.y > 20) {
    ctx.strokeStyle = 'rgba(255,70,130,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 7, 0, Math.PI * 2); ctx.stroke();
  }
  const bw = Math.max(30, e.r * 1.6);
  const barY = e.y - e.r - (e.armor > 0 ? 26 : 14);
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(e.x - bw / 2, barY, bw, 5);
  ctx.fillStyle = e.armor > 0 ? '#8eb4ff' : '#ff3355';
  ctx.fillRect(e.x - bw / 2, barY, bw * clamp(e.hp, 0, e.maxHp) / e.maxHp, 5);
  if (e.armor > 0) {
    const label = '装甲' + e.armor;
    ctx.font = 'bold 12px ' + FONT;
    const tw = ctx.measureText(label).width + 20;
    const by = e.y - e.r - 14;
    ctx.fillStyle = 'rgba(12,16,24,0.88)';
    roundRect(e.x - tw / 2, by - 8, tw, 16, 8); ctx.fill();
    ctx.strokeStyle = '#d5deea'; ctx.lineWidth = 1.25; ctx.stroke();
    drawShield(e.x - tw / 2 + 9, by, 4.6);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#f4f7fb';
    ctx.fillText(label, e.x - tw / 2 + 16, by);
  }
  ctx.font = 'bold ' + (e.type === 'boss' || e.type === 'elite' ? 20 : 13) + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const ty = e.y + (e.type === 'boss' ? e.r * 0.55 : 1);
  ctx.lineWidth = 3.5; ctx.strokeStyle = '#000'; ctx.strokeText(fmt(Math.max(0, e.hp)), e.x, ty);
  ctx.fillStyle = '#fff'; ctx.fillText(fmt(Math.max(0, e.hp)), e.x, ty);
}
function drawBlock(k) {
  const weapon = k.kind === 'weapon';
  const color = weapon ? WEAPONS[k.key].color : UPGRADES[k.key].color;
  const s = 1 + k.pulse * 0.8 + Math.sin(time * 5 + k.x) * 0.02;
  ctx.save(); ctx.translate(k.x, k.y); ctx.scale(s, s);
  ctx.shadowColor = color; ctx.shadowBlur = 16;
  if (weapon) {
    ctx.fillStyle = k.flash > 0 ? '#ffffff' : '#161b28';
    roundRect(-k.w / 2, -k.h / 2, k.w, k.h, 12); ctx.fill();
    ctx.shadowBlur = 0; ctx.lineWidth = 5; ctx.strokeStyle = k.flash > 0 ? '#fff' : color; ctx.stroke();
    drawWeaponIcon(k.key, 0, -22, 0.85);
  } else {
    ctx.fillStyle = k.flash > 0 ? '#ffffff' : color;
    roundRect(-k.w / 2, -k.h / 2, k.w, k.h, 12); ctx.fill();
    ctx.shadowBlur = 0; ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(-k.w / 2 + 8, k.h / 2 - 12, k.w - 16, 6);
  ctx.fillStyle = '#fff'; ctx.fillRect(-k.w / 2 + 8, k.h / 2 - 12, (k.w - 16) * (1 - k.n / k.max), 6);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 32px ' + FONT; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.65)';
  const ny = weapon ? 6 : -4;
  ctx.strokeText(k.n, 0, ny); ctx.fillStyle = '#fff'; ctx.fillText(k.n, 0, ny);
  ctx.restore();
  ctx.font = 'bold 15px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let tag;
  if (weapon) tag = WEAPONS[k.key].name;
  else tag = UPGRADES[k.key].icon + ' ' + UPGRADES[k.key].label;
  const tw = ctx.measureText(tag).width + (weapon ? 36 : 16);
  const tx = k.x - tw / 2, ty = k.y - k.h / 2 - 28;
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; roundRect(tx, ty, tw, 22, 11); ctx.fill();
  if (weapon) {
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
    drawWeaponIcon(k.key, tx + 14, ty + 11, 0.62);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    ctx.fillText(WEAPONS[k.key].name, tx + 26, ty + 11);
  } else {
    ctx.fillStyle = '#fff'; ctx.fillText(tag, k.x, ty + 11);
  }
}
function drawGate(g) {
  const good = g.v >= 0;
  const top = g.y - g.h / 2;
  ctx.save();
  ctx.globalAlpha = g.flash > 0 ? 0.48 : 0.26;
  ctx.fillStyle = good ? '#28c8ff' : '#ff3c5a';
  ctx.fillRect(g.x + 4, top, g.w - 8, g.h);
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = g.flash > 0 ? 0.95 : 0.72;
  ctx.fillStyle = good ? '#7ee8ff' : '#ff8fa3';
  ctx.fillRect(g.x + 4, top, 6, g.h); ctx.fillRect(g.x + g.w - 10, top, 6, g.h);
  ctx.restore();
  ctx.font = 'bold 22px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const t = g.unit + ' ' + (good ? '+' : '') + g.v;
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(t, g.x + g.w / 2, g.y);
  ctx.fillStyle = '#fff'; ctx.fillText(t, g.x + g.w / 2, g.y);
}
function drawPlayerShots() {
  for (const b of bullets) {
    if (b.kind === 'rocket') {
      ctx.save(); ctx.translate(b.x, b.y);
      ctx.fillStyle = b.big ? '#ff5a2a' : '#ff8a55';
      ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(7, 8); ctx.lineTo(-7, 8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffe14a'; ctx.fillRect(-2.5, 8, 5, 8);
      ctx.restore();
    } else if (b.kind === 'pellet') {
      ctx.fillStyle = 'rgba(255,154,60,0.35)';
      ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd7a4';
      ctx.beginPath(); ctx.arc(b.x, b.y, 2.6, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,225,74,0.35)';
      ctx.fillRect(b.x - 3.5, b.y - 9, 7, 16);
      ctx.fillStyle = '#fff6a8';
      ctx.fillRect(b.x - 1.6, b.y - 7, 3.2, 12);
    }
  }
}
function drawLaserBeams() {
  if (state === 'over' || stats.weapon !== 'laser') return;
  const pulse = 0.55 + Math.sin(time * 28) * 0.15;
  const beams = [{ x: player.x, w: laserWidth(), a: pulse, y: PLAYER_Y - 18 }];
  for (let i = 0; i < stats.allies; i++) {
    const a = allyPos(i);
    beams.push({ x: a.x, w: 4.5, a: pulse * 0.55, y: a.y - 10 });
  }
  for (const b of beams) {
    const grd = ctx.createLinearGradient(0, b.y, 0, 0);
    grd.addColorStop(0, 'rgba(120, 240, 255,' + b.a + ')');
    grd.addColorStop(1, 'rgba(180, 255, 255, 0.02)');
    ctx.fillStyle = grd;
    ctx.fillRect(b.x - b.w / 2, 0, b.w, b.y);
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.95, b.a + 0.25) + ')';
    ctx.fillRect(b.x - 1.1, 0, 2.2, b.y);
  }
}
function drawEnemyBullets() {
  for (const b of ebullets) {
    ctx.fillStyle = 'rgba(255, 40, 120, 0.33)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff2d6a';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe4f2';
    ctx.beginPath(); ctx.arc(b.x - 1.2, b.y - 1.2, b.r * 0.38, 0, Math.PI * 2); ctx.fill();
  }
}
function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, 64);
  ctx.textBaseline = 'middle';
  const wpn = WEAPONS[stats.weapon];
  ctx.font = 'bold 18px ' + FONT; ctx.textAlign = 'center';
  const nw = ctx.measureText(wpn.name).width;
  drawWeaponIcon(stats.weapon, W / 2 - nw / 2 - 14, 22, 0.78);
  ctx.fillStyle = wpn.color; ctx.fillText(wpn.name, W / 2 + 8, 22);
  ctx.textAlign = 'left';
  ctx.font = 'bold 20px ' + FONT; ctx.fillStyle = '#ffe14d';
  ctx.fillText('スコア ' + score, 12, 20);
  ctx.font = 'bold 13px ' + FONT; ctx.fillStyle = '#cfe3ff';
  ctx.fillText('撃破 ' + kills + '   ' + Math.floor(time) + '秒', 12, 46);
  ctx.textAlign = 'right'; ctx.font = '18px ' + FONT;
  let hs = ''; for (let i = 0; i < stats.maxHp; i++) hs += i < stats.hp ? '❤' : '♡';
  ctx.fillStyle = '#ff4d6d'; ctx.fillText(hs, W - 10, 20);
  ctx.font = 'bold 12px ' + FONT; ctx.fillStyle = '#cfe3ff'; ctx.fillText('ベスト ' + best, W - 10, 46);
  const items = [
    ['発射', stats.multi, '#ff4fa3'], ['連射', stats.rate.toFixed(1), '#ffb321'], ['攻撃', stats.power, '#ff5a3c'],
    ['仲間', stats.allies, '#33d17a'], ['貫通', stats.pierce, '#3fa9ff'],
  ];
  const bw = (W - 12) / items.length;
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, H - 40, W, 40);
  items.forEach((it, i) => {
    const x = 6 + bw * i + bw / 2;
    ctx.textAlign = 'center'; ctx.font = 'bold 11px ' + FONT; ctx.fillStyle = it[2]; ctx.fillText(it[0], x, H - 29);
    ctx.font = 'bold 16px ' + FONT; ctx.fillStyle = '#fff'; ctx.fillText(String(it[1]), x, H - 12);
  });
}
function drawCenterText(lines) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const l of lines) {
    ctx.font = 'bold ' + l.size + 'px ' + FONT;
    ctx.lineWidth = l.size / 5; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText(l.t, W / 2, l.y);
    ctx.fillStyle = l.c || '#fff'; ctx.fillText(l.t, W / 2, l.y);
  }
}
function render() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  drawBackground();
  for (const e of enemies) drawEnemy(e);
  for (const g of gates) drawGate(g);
  for (const k of blocks) drawBlock(k);
  drawLaserBeams();
  drawPlayerShots();
  drawEnemyBullets();
  if (state !== 'over') {
    for (let i = 0; i < stats.allies; i++) { const a = allyPos(i); drawSoldier(a.x, a.y, 0.62, '#33d17a', false); }
    const blink = player.hurt > 0 && Math.floor(player.hurt * 18) % 2 === 0;
    drawSoldier(player.x, PLAYER_Y, 1.15, '#3fa9ff', blink);
  }
  for (const r of rings) { ctx.strokeStyle = r.color; ctx.globalAlpha = Math.max(0, r.life * 2); ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke(); }
  ctx.globalAlpha = 1;
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const a = Math.min(1, t.life / t.max * 2), sc = 1 + Math.max(0, (t.life / t.max - 0.8)) * 2;
    ctx.globalAlpha = a; ctx.font = 'bold ' + Math.round(t.size * sc) + 'px ' + FONT;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText(t.str, t.x, t.y);
    ctx.fillStyle = t.color; ctx.fillText(t.str, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = 'rgba(255,40,70,' + flash * 0.75 + ')'; ctx.fillRect(0, 0, W, H); }
  if (state === 'play' || state === 'over') drawHUD();
  if (banner && state === 'play') {
    ctx.globalAlpha = Math.min(1, banner.t * 2);
    ctx.fillStyle = 'rgba(40,10,50,0.78)'; ctx.fillRect(0, H * 0.3, W, 54);
    drawCenterText([{ t: banner.text, y: H * 0.3 + 27, size: 26, c: '#ffe14d' }]);
    ctx.globalAlpha = 1;
  }
  if (state === 'title') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
    const bob = Math.sin(performance.now() / 300) * 6;
    drawCenterText([
      { t: '撃って強化！', y: 200 + bob, size: 48, c: '#ffe14d' },
      { t: 'ラストシューター', y: 258 + bob, size: 36, c: '#ff4fa3' },
      { t: '降ってくる敵を撃ちまくれ！', y: 340, size: 20 },
      { t: '赤く光る敵弾に当たるとハートが減る', y: 378, size: 16, c: '#ff9ec4' },
      { t: '武器ブロックを壊すと武器が切り替わる', y: 412, size: 16, c: '#9fe3ff' },
      { t: '装甲兵はレーザーとロケット向き', y: 446, size: 16, c: '#d5deea' },
      { t: 'ドラッグで左右に移動（自動射撃）', y: 492, size: 16, c: '#cfe3ff' },
    ]);
    if (Math.floor(performance.now() / 500) % 2 === 0) drawCenterText([{ t: 'タップしてスタート', y: 580, size: 28 }]);
    drawSoldier(W / 2, 690, 1.5, '#3fa9ff', false);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(0.65, overT) + ')'; ctx.fillRect(0, 0, W, H);
    const lines = [
      { t: 'ゲームオーバー', y: 230, size: 44, c: '#ff4d6d' },
      { t: 'スコア  ' + score, y: 310, size: 34, c: '#ffe14d' },
      { t: 'ベスト  ' + best, y: 358, size: 22 },
      { t: '撃破 ' + kills + '　生存 ' + Math.floor(time) + '秒', y: 400, size: 18, c: '#cfe3ff' },
      { t: '武器  ' + WEAPONS[stats.weapon].name, y: 436, size: 18, c: WEAPONS[stats.weapon].color },
    ];
    if (score >= best && score > 0) lines.push({ t: '★ 新記録！ ★', y: 486, size: 26, c: '#33e08a' });
    drawCenterText(lines);
    if (overT > 0.6 && Math.floor(performance.now() / 500) % 2 === 0) drawCenterText([{ t: 'タップでリトライ', y: 570, size: 28 }]);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__game = {
  get state() { return state; },
  get stats() { return stats; },
  get score() { return score; },
  get time() { return time; },
  get weapon() { return stats.weapon; },
  get hp() { return stats.hp; },
  get counts() {
    let armor = 0, shooters = 0, weaponBlocks = 0;
    for (const e of enemies) {
      if ((e.armor || 0) > 0) armor++;
      if (e.fires) shooters++;
    }
    for (const b of blocks) if (b.kind === 'weapon') weaponBlocks++;
    return { enemies: enemies.length, blocks: blocks.length, gates: gates.length, bullets: bullets.length, ebullets: ebullets.length, particles: particles.length, armor, shooters, weaponBlocks };
  },
  world() { return { gates, bullets, ebullets, enemies, blocks, player, stats, texts }; },
  setKeepAlive(v) { keepAlive = !!v; },
  skip(t) { time += t; gateT -= t; bossT -= t; eliteT -= t; weaponT -= t; },
};
})();
</script>
