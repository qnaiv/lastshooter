<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
'use strict';
const W = 450, H = 800;
const PLAYER_Y = H - 120;
const DEFENSE_Y = H - 80;
const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo","WenQuanYi Micro Hei","Droid Sans Fallback",sans-serif';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  scale = s;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.floor(W * s * dpr);
  cv.height = Math.floor(H * s * dpr);
}
window.addEventListener('resize', resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function removeDead(arr) { let j = 0; for (let i = 0; i < arr.length; i++) if (!arr[i].dead) arr[j++] = arr[i]; arr.length = j; }
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fmt(n) { return n >= 10000 ? (n / 1000).toFixed(1) + 'k' : String(Math.floor(n)); }

// =============================================================================
// STAGES — ステージごとの設定。数値を変えるだけで難度を調整できます。
// 配列の先頭がステージ1。定義より先は scaleStage() が最終行を基準に強化します。
// 各行: 出してよい敵、出現間隔、HP倍率、装甲値、射撃兵の上限、弾幕、弾速、ボス。
// shooterPatterns に同じ名前を繰り返すとその弾幕の出やすさが上がる。
// 装甲の減算式（resolveHit）とゲートの通り抜けはここにはありません。
// デバッグ: ?stage=3 でそのステージから開始（1〜99）。
// =============================================================================
const STAGE_CLEAR_HOLD = 1.65;

const STAGES = [
  {
    // ステージ1: 通常・高速・タンクのみ。射撃なし、装甲なし。ボスは撃たない。
    // ショットガンの武器ブロックを1つ保証する。

    types: ['grunt', 'runner', 'tank'],
    weights: { grunt: 60, runner: 26, tank: 14 },
    hpMul: 1,
    speedMul: 1,
    spawnEvery: 2.25,
    spawnEveryEnd: 1.65,
    waveMin: 1,
    waveMax: 3,
    armor: 0,
    armorPerWave: 0,
    armorAfter: 999,
    armorFires: false,
    shooterMax: 0,
    shooterPatterns: [],
    shooterInterval: 9,
    shooterWaveChance: 0,
    bulletSpeed: 0,
    blockEvery: [6.5, 9.5],
    weaponEvery: [16, 22],
    gateEvery: [16, 24],
    guaranteeWeapon: 'sg',
    guaranteeAt: 5,
    elite: null,
    boss: { hp: 520, armor: 0, fires: false, patterns: [], interval: 99, bulletSpeed: 0 },
  },
  {
    // ステージ2: 低装甲を少数。レーザーかロケットを装甲より先に出す。射撃兵はまだ出さない。
    // ボスはたまに遅い単発の狙い撃ち。
    duration: 52,
    types: ['grunt', 'runner', 'tank', 'armor'],
    weights: { grunt: 48, runner: 20, tank: 18, armor: 14 },
    hpMul: 1.18,
    speedMul: 1.03,
    spawnEvery: 2.05,
    spawnEveryEnd: 1.45,
    waveMin: 1,
    waveMax: 3,
    armor: 5,
    armorPerWave: 1,
    armorAfter: 12,
    armorFires: false,
    shooterMax: 0,
    shooterPatterns: [],
    shooterInterval: 9,
    shooterWaveChance: 0,
    bulletSpeed: 110,
    blockEvery: [6.5, 9.2],
    weaponEvery: [15, 21],
    gateEvery: [16, 24],
    guaranteeWeapon: 'antiarmor',
    guaranteeAt: 3.5,
    elite: null,
    boss: { hp: 860, armor: 0, fires: true, patterns: ['aim1'], interval: 2.9, bulletSpeed: 100 },
  },
  {
    // ステージ3: 射撃兵が初登場。同時に1体、遅い単発狙い、間隔は長め。
    duration: 52,
    types: ['grunt', 'runner', 'tank', 'armor', 'shooter'],
    weights: { grunt: 40, runner: 16, tank: 14, armor: 16, shooter: 14 },
    hpMul: 1.38,
    speedMul: 1.06,
    spawnEvery: 1.9,
    spawnEveryEnd: 1.3,
    waveMin: 2,
    waveMax: 4,
    armor: 6,
    armorPerWave: 1,
    armorAfter: 0,
    armorFires: false,
    shooterMax: 1,
    shooterPatterns: ['aim1'],
    shooterInterval: 2.45,
    shooterWaveChance: 0,
    bulletSpeed: 128,
    blockEvery: [6.8, 9.4],
    weaponEvery: [14, 20],
    gateEvery: [17, 25],
    guaranteeWeapon: null,
    guaranteeAt: 0,
    elite: null,
    boss: { hp: 1100, armor: 2, fires: true, patterns: ['aim1'], interval: 2.15, bulletSpeed: 128 },
  },
  {
    // ステージ4: 射撃兵は同時2〜3体。たまに3way。装甲ミニボスが来ることがある。
    duration: 55,
    types: ['grunt', 'runner', 'tank', 'armor', 'shooter'],
    weights: { grunt: 32, runner: 14, tank: 12, armor: 20, shooter: 22 },
    hpMul: 1.62,
    speedMul: 1.1,
    spawnEvery: 1.65,
    spawnEveryEnd: 1.1,
    waveMin: 2,
    waveMax: 4,
    armor: 7,
    armorPerWave: 2,
    armorAfter: 0,
    armorFires: false,
    shooterMax: 3,
    shooterPatterns: ['aim1', 'aim1', 'aim1', 'aim1', 'aim3', 'down3'],
    shooterInterval: 1.7,
    shooterWaveChance: 0,
    bulletSpeed: 155,
    blockEvery: [7, 9.6],
    weaponEvery: [14, 20],
    gateEvery: [18, 26],
    guaranteeWeapon: null,
    guaranteeAt: 0,
    elite: {
      after: 20,
      chance: 0.7,
      hp: 680,
      armor: 8,
      fires: true,
      patterns: ['aim1', 'aim3', 'spread'],
      interval: 2.15,
      bulletSpeed: 145,
    },
    boss: { hp: 1450, armor: 4, fires: true, patterns: ['aim3', 'spread', 'aim1'], interval: 1.85, bulletSpeed: 155 },
  },
  {
    // ステージ5以降: リング、ボスの扇・螺旋。密度が上がり、当たると痛いローグライト帯。
    duration: 58,
    types: ['grunt', 'runner', 'tank', 'armor', 'shooter'],
    weights: { grunt: 24, runner: 12, tank: 12, armor: 22, shooter: 30 },
    hpMul: 1.9,
    speedMul: 1.14,
    spawnEvery: 1.35,
    spawnEveryEnd: 0.88,
    waveMin: 2,
    waveMax: 5,
    armor: 9,
    armorPerWave: 2,
    armorAfter: 0,
    armorFires: false,
    shooterMax: 4,
    shooterPatterns: ['aim3', 'aim3', 'spread5', 'aim5', 'ring'],
    shooterInterval: 1.12,
    shooterWaveChance: 0.2,
    bulletSpeed: 185,
    blockEvery: [7.2, 10],
    weaponEvery: [13, 19],
    gateEvery: [18, 26],
    guaranteeWeapon: null,
    guaranteeAt: 0,
    elite: {
      after: 16,
      chance: 0.85,
      hp: 880,
      armor: 10,
      fires: true,
      patterns: ['aim3', 'ring', 'spread'],
      interval: 1.7,
      bulletSpeed: 170,
    },
    boss: { hp: 1900, armor: 6, fires: true, patterns: ['ring', 'fan', 'spiral'], interval: 1.5, bulletSpeed: 188 },
  },
];

function cloneStage(base) {
  return {
    duration: base.duration,
    types: base.types.slice(),
    weights: Object.assign({}, base.weights),
    hpMul: base.hpMul,
    speedMul: base.speedMul,
    spawnEvery: base.spawnEvery,
    spawnEveryEnd: base.spawnEveryEnd,
    waveMin: base.waveMin,
    waveMax: base.waveMax,
    armor: base.armor,
    armorPerWave: base.armorPerWave,
    armorAfter: base.armorAfter,
    armorFires: base.armorFires,
    shooterMax: base.shooterMax,
    shooterPatterns: base.shooterPatterns.slice(),
    shooterInterval: base.shooterInterval,
    shooterWaveChance: base.shooterWaveChance,
    bulletSpeed: base.bulletSpeed,
    blockEvery: base.blockEvery.slice(),
    weaponEvery: base.weaponEvery.slice(),
    gateEvery: base.gateEvery.slice(),
    guaranteeWeapon: base.guaranteeWeapon,
    guaranteeAt: base.guaranteeAt,
    elite: base.elite ? {
      after: base.elite.after,
      chance: base.elite.chance,
      hp: base.elite.hp,
      armor: base.elite.armor,
      fires: base.elite.fires,
      patterns: base.elite.patterns.slice(),
      interval: base.elite.interval,
      bulletSpeed: base.elite.bulletSpeed,
    } : null,
    boss: {
      hp: base.boss.hp,
      armor: base.boss.armor,
      fires: base.boss.fires,
      patterns: base.boss.patterns.slice(),
      interval: base.boss.interval,
      bulletSpeed: base.boss.bulletSpeed,
    },
  };
}

// extra = 1 が「表の次のステージ」（5段定義ならステージ6）。
function scaleStage(base, extra) {
  const s = cloneStage(base);
  const k = extra;
  s.hpMul = +(s.hpMul * (1 + 0.22 * k)).toFixed(3);
  s.speedMul = +Math.min(1.5, s.speedMul * (1 + 0.04 * k)).toFixed(3);
  s.spawnEvery = +Math.max(0.7, s.spawnEvery * (1 - 0.07 * k)).toFixed(3);
  s.spawnEveryEnd = +Math.max(0.48, s.spawnEveryEnd * (1 - 0.07 * k)).toFixed(3);
  s.waveMax = Math.min(8, s.waveMax + k);
  s.waveMin = Math.min(s.waveMax, s.waveMin + Math.floor(k / 2));
  s.armor = s.armor + k;
  s.armorPerWave = Math.min(3, s.armorPerWave + (k >= 3 ? 1 : 0));
  s.shooterMax = Math.min(6, s.shooterMax + Math.floor(k / 2));
  s.shooterInterval = +Math.max(0.48, s.shooterInterval * (1 - 0.08 * k)).toFixed(3);
  s.shooterWaveChance = Math.min(0.55, +(s.shooterWaveChance + 0.04 * k).toFixed(3));
  s.bulletSpeed = Math.round(s.bulletSpeed * (1 + 0.06 * k));
  s.boss.hp = Math.round(s.boss.hp * (1 + 0.2 * k));
  s.boss.armor = s.boss.armor + Math.floor(k * 0.8);
  s.boss.bulletSpeed = Math.round(s.boss.bulletSpeed * (1 + 0.06 * k));
  s.boss.interval = +Math.max(0.72, s.boss.interval * (1 - 0.06 * k)).toFixed(3);
  if (s.elite) {
    s.elite.hp = Math.round(s.elite.hp * (1 + 0.18 * k));
    s.elite.armor = s.elite.armor + k;
    s.elite.bulletSpeed = Math.round(s.elite.bulletSpeed * (1 + 0.06 * k));
    s.elite.interval = +Math.max(0.7, s.elite.interval * (1 - 0.05 * k)).toFixed(3);
    s.elite.chance = Math.min(1, +(s.elite.chance + 0.04 * k).toFixed(3));
  }
  return s;
}

function stageConfig(n) {
  const i = Math.max(1, n | 0);
  if (i <= STAGES.length) return cloneStage(STAGES[i - 1]);
  return scaleStage(STAGES[STAGES.length - 1], i - STAGES.length);
}

function queryStage() {
  try {
    const n = parseInt(new URLSearchParams(location.search).get('stage'), 10);
    if (n >= 1 && n <= 99) return n;
  } catch (err) {}
  return 1;
}

// ---------- weapons ----------
// Stats are global; each weapon reads them differently.
// Armor: dealt = max(1, raw - eff). MG/SG use full armor (spray chips and shows ブロック).
// Laser ignores 80% (eff = floor(armor*0.2)). Rocket ignores 60% (eff = floor(armor*0.4)).
const WEAPONS = {
  mg:     { name: 'マシンガン', color: '#ffe14a' },
  sg:     { name: 'ショットガン', color: '#ff9a3c' },
  laser:  { name: 'レーザー',   color: '#5cecff' },
  rocket: { name: 'ロケット',   color: '#ff5a2a' },
};
const WEAPON_IDS = ['mg', 'sg', 'laser', 'rocket'];

function mgDmg() { return 1 + Math.floor((stats.power - 1) * 0.4); }
function sgDmg() { return 3 + Math.floor(stats.power * 1.05); }
function sgRate() { return Math.max(0.8, stats.rate * 0.2); }
function laserTickDmg() {
  const base = 3 + stats.power * 0.75;
  const multiB = 1 + (stats.multi - 1) * 0.045;
  const pierceB = 1 + stats.pierce * 0.06;
  return Math.max(1, Math.round(base * multiB * pierceB));
}
function laserTicksPerSec() { return 9 + stats.rate * 0.3; }
function laserWidth() { return 11 + (stats.multi - 1) * 1.15; }
function rocketDmg() { return Math.max(1, Math.round((46 + stats.power * 16) * (1 + (stats.multi - 1) * 0.04))); }
function rocketRate() { return 0.42 + stats.rate * 0.045; }
function rocketSplash() { return 38 + stats.multi * 2 + stats.pierce * 4; }

function resolveHit(raw, armor, weapon) {
  const a = armor || 0;
  if (a <= 0) return { dmg: raw, blocked: false };
  let eff = a;
  if (weapon === 'laser') eff = Math.floor(a * 0.2);
  else if (weapon === 'rocket') eff = Math.floor(a * 0.4);
  if (raw <= eff) return { dmg: 1, blocked: true };
  return { dmg: raw - eff, blocked: false };
}

// ---------- upgrades ----------
const UPGRADES = {
  multi:  { label: '発射数 +1',  icon: '🔫', color: '#ff4fa3', apply: s => { s.multi = Math.min(s.multi + 1, 9); } },
  rate:   { label: '連射速度UP', icon: '⚡', color: '#ffb321', apply: s => { s.rate = Math.min(+(s.rate * 1.25).toFixed(3), 20); } },
  power:  { label: '攻撃力UP',   icon: '💥', color: '#ff5a3c', apply: s => { s.power += 1; } },
  ally:   { label: '仲間 +2',    icon: '👥', color: '#33d17a', apply: s => { s.allies = Math.min(s.allies + 2, 12); } },
  pierce: { label: '貫通 +1',    icon: '➶', color: '#3fa9ff', apply: s => { s.pierce = Math.min(s.pierce + 1, 5); } },
  heal:   { label: '体力回復',   icon: '❤', color: '#ff3b6b', apply: s => { s.hp = Math.min(s.hp + 1, s.maxHp); } },
};
const GATE_CAP = { ally: 6, power: 3, multi: 2 };
const UPG_KEYS = ['multi', 'rate', 'power', 'ally', 'pierce'];

// ---------- state ----------
let state = 'title';
let stats, player, bullets, ebullets, enemies, blocks, gates, particles, texts, rings;
let time, score, kills, spawnT, blockT, weaponT, gateT, fireT, laserAcc, allyRocketAcc, allyCursor;
let shake, flash, best = 0, bestStage = 0, overT = 0, banner, keepAlive = false;
let recordKind = '';
let stageRecordThisRun = false;
let stageNum = 1, stageTime = 0, stagePhase = 'fight', clearT = 0, spec = null;
let eliteRolled = false, guaranteedWeaponSpawned = true, bossGap = 1.8;
try { best = +localStorage.getItem('adShooterBest') || 0; } catch (e) {}
try { bestStage = +localStorage.getItem('adShooterBestStage') || 0; } catch (e) {}

function reset() {
  stats = { multi: 1, rate: 7, power: 1, allies: 0, pierce: 0, hp: 5, maxHp: 5, weapon: 'mg' };
  player = { x: W / 2, tx: W / 2, hurt: 0 };
  bullets = []; ebullets = []; enemies = []; blocks = []; gates = []; particles = []; texts = []; rings = [];
  time = 0; score = 0; kills = 0;
  fireT = 0; laserAcc = 0; allyRocketAcc = 0.4; allyCursor = 0;
  shake = 0; flash = 0; banner = null; overT = 0;
  recordKind = '';
  stageRecordThisRun = false;
  stageNum = queryStage();
  beginStage();
}
reset();

// ---------- input ----------
let dragging = false, lastPX = 0;
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toLogical(e);
  if (state === 'title') { state = 'play'; reset(); return; }
  if (state === 'over') { if (overT > 0.6) { state = 'play'; reset(); } return; }
  dragging = true; lastPX = p.x;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!dragging || state !== 'play') return;
  const p = toLogical(e);
  player.tx = clamp(player.tx + (p.x - lastPX) * 1.3, 24, W - 24);
  lastPX = p.x;
});
const endDrag = () => { dragging = false; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', e => {
  if (state !== 'play') { if (e.key === ' ' || e.key === 'Enter') { state = 'play'; reset(); } return; }
  if (e.key === 'ArrowLeft' || e.key === 'a') player.tx = clamp(player.tx - 40, 24, W - 24);
  if (e.key === 'ArrowRight' || e.key === 'd') player.tx = clamp(player.tx + 40, 24, W - 24);
});

// ---------- effects ----------
function burst(x, y, color, n, spd = 220, size = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(spd * 0.3, spd);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.7), max: 0.7, color, size: rand(size * 0.5, size * 1.3) });
  }
  if (particles.length > 600) particles.splice(0, particles.length - 600);
}
function popText(x, y, str, color = '#fff', size = 18, life = 0.7) {
  texts.push({ x, y, str, color, size, life, max: life, vy: -70 });
  if (texts.length > 80) texts.splice(0, texts.length - 80);
}
function addShake(v) { shake = Math.min(shake + v, 14); }

function randRange(pair) { return rand(pair[0], pair[1]); }

function noteStageReached() {
  if (state !== 'play') return;
  if (stageNum > bestStage) {
    bestStage = stageNum;
    stageRecordThisRun = true;
    try { localStorage.setItem('adShooterBestStage', String(bestStage)); } catch (e) {}
  }
}

function beginStage() {
  spec = stageConfig(stageNum);
  stageTime = 0;
  stagePhase = 'fight';
  clearT = 0;
  spawnT = 0.8;
  blockT = randRange(spec.blockEvery) * 0.45;
  if (spec.guaranteeWeapon) {
    weaponT = spec.guaranteeAt;
    guaranteedWeaponSpawned = false;
  } else {
    weaponT = randRange(spec.weaponEvery);
    guaranteedWeaponSpawned = true;
  }
  gateT = randRange(spec.gateEvery) * 0.45;
  eliteRolled = false;
  bossGap = 1.8;
  banner = { text: 'ステージ' + stageNum, t: 1.7 };
  noteStageReached();
}

function allows(type) {
  return !!(spec && spec.types && spec.types.indexOf(type) !== -1);
}

function armorAllowed() {
  if (!spec || spec.armor <= 0 || !allows('armor')) return false;
  if (stageTime < (spec.armorAfter || 0)) return false;
  return true;
}

function stageProgress() {
  return clamp(stageTime / Math.max(1, spec.duration), 0, 1);
}

function stageHpScale() {
  return spec.hpMul * (1 + stageProgress() * 0.18);
}

function rollHp(min, max) {
  return Math.max(1, Math.round(rand(min, max) * stageHpScale()));
}

function currentSpawnEvery() {
  const u = stageProgress();
  return spec.spawnEvery + (spec.spawnEveryEnd - spec.spawnEvery) * u;
}

function waveCount() {
  const u = stageProgress();
  const hi = Math.max(spec.waveMin, Math.round(spec.waveMin + (spec.waveMax - spec.waveMin) * u));
  return randi(spec.waveMin, hi);
}

function firingCount() {
  let n = 0;
  for (const e of enemies) if (!e.dead && e.fires && e.type !== 'boss' && e.type !== 'elite') n++;
  return n;
}
function aliveType(type) {
  for (const e of enemies) if (!e.dead && e.type === type) return true;
  return false;
}

// ---------- spawning ----------
function spawnEnemy(type, opts) {
  opts = opts || {};
  const sm = (spec && spec.speedMul) || 1;
  if (type === 'shooter' && (!allows('shooter') || spec.shooterMax <= 0 || (firingCount() >= spec.shooterMax && !opts.force))) type = 'grunt';
  if (type === 'armor' && !armorAllowed()) type = 'grunt';
  let e = null;
  if (type === 'boss') {
    const b = spec.boss;
    const hp = Math.max(1, b.hp | 0);
    const canFire = !!(b.fires && b.patterns && b.patterns.length && b.bulletSpeed > 0);
    e = {
      type, x: W / 2, y: -80, r: 52, hp, maxHp: hp, vy: 32, color: '#8e2de2',
      score: 800 + (stageNum - 1) * 180, wob: 0, armor: b.armor || 0, fires: canFire,
      stopY: 158, atk: null, atkT: b.interval || 2, spin: rand(0, 6), volleys: 0,
    };
    banner = { text: '⚠ ボス出現！ ⚠', t: 2.1 };
  } else if (type === 'elite') {
    const el = spec.elite || { hp: 700, armor: (spec.armor || 0) + 3, fires: false, patterns: [], interval: 2, bulletSpeed: 0 };
    const hp = Math.max(1, Math.round(el.hp * (1 + stageProgress() * 0.08)));
    const canFire = !!(el.fires && el.patterns && el.patterns.length && el.bulletSpeed > 0);
    e = {

function rollEnemyType() {
  const w = spec.weights || {};
  const entries = [];
  const add = (type, weight) => { if (weight > 0 && allows(type)) entries.push({ type, weight }); };
  add('grunt', w.grunt || 0);
  add('runner', w.runner || 0);
  add('tank', w.tank || 0);
  if (armorAllowed()) add('armor', w.armor || 0);
  if (spec.shooterMax > 0 && firingCount() < spec.shooterMax) add('shooter', w.shooter || 0);
  if (!entries.length) return 'grunt';
  let sum = 0;
  for (let i = 0; i < entries.length; i++) sum += entries[i].weight;
  let r = Math.random() * sum;
  for (let i = 0; i < entries.length; i++) {
    r -= entries[i].weight;
    if (r <= 0) return entries[i].type;
  }
  return 'grunt';
}

function spawnWave() {
  if (spec.shooterWaveChance > 0 && spec.shooterMax > 0 && allows('shooter') && Math.random() < spec.shooterWaveChance) {
    const room = spec.shooterMax - firingCount();
    const count = Math.min(room, randi(2, Math.max(2, spec.shooterMax)));
    if (count > 0) {
      const gap = (W - 70) / Math.max(count - 1, 1);
      const pats = spec.shooterPatterns;
      for (let i = 0; i < count; i++) {
        spawnEnemy('shooter', {
          force: true,
          x: 36 + gap * i,
          y: -24 - (i % 2) * 26,
          stopY: rand(150, 250),
          pattern: pats.length ? pats[i % pats.length] : 'aim1',
          fireT: 0.45 + i * 0.16,
        });
      }
      return;
    }
  }
  const n = waveCount();
  let armorN = 0;
  for (let i = 0; i < n; i++) {
    let type = rollEnemyType();
    if (type === 'armor') {
      if (armorN >= spec.armorPerWave) type = 'grunt';
      else armorN++;
    }
    spawnEnemy(type, { y: -24 - rand(0, 90) });
  }
}

function blockSize(base, span, cap) {

function chooseWeaponKey(forced) {

// ---------- enemy bullets ----------
function emitDir(x, y, ang, spd) {
  if (ebullets.length > 380) return;
  ebullets.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 6.2, dead: false });
}
function emitAim(x, y, n, spread, spd) {
  const ang = Math.atan2(PLAYER_Y - y, player.x - x);
  for (let i = 0; i < n; i++) emitDir(x, y, ang + (i - (n - 1) / 2) * spread, spd);
}
function emitDown(x, y, n, spread, spd) {
  for (let i = 0; i < n; i++) emitDir(x, y, Math.PI / 2 + (i - (n - 1) / 2) * spread, spd);
}
function emitRing(x, y, rot, n, spd) {
  for (let i = 0; i < n; i++) emitDir(x, y, rot + (i / n) * Math.PI * 2, spd);
}
function emitPattern(e, pattern) {
  const spd = spec.bulletSpeed;
  if (!(spd > 0)) return;
  const x = e.x, y = e.y + e.r * 0.25;
  if (pattern === 'down1') emitDown(x, y, 1, 0, spd);
  else if (pattern === 'down3') emitDown(x, y, 3, 0.24, spd);
  else if (pattern === 'spread' || pattern === 'spread5') emitDown(x, y, 5, 0.2, spd * 0.96);
  else if (pattern === 'aim3') emitAim(x, y, 3, 0.2, spd);
  else if (pattern === 'aim5') emitAim(x, y, 5, 0.16, spd);
  else if (pattern === 'fan') emitAim(x, y, 7, 0.16, spd * 0.92);
  else if (pattern === 'ring') { emitRing(x, y, e.spin || 0, 8, spd * 0.74); e.spin = (e.spin || 0) + 0.28; }
  else emitAim(x, y, 1, 0, spd);
}
function patternAllowed(list, pattern) {
  return !!(list && list.indexOf(pattern) >= 0);
}
function updateEnemyFire(e, dt) {
  if (!e.fires) return;
  if (e.y < 36 || e.y > DEFENSE_Y - 30) return;
  if (e.type === 'boss' || e.type === 'elite') { updateBigFire(e, dt); return; }
  if (spec.shooterMax <= 0 || !(spec.bulletSpeed > 0)) return;
  const allowed = spec.shooterPatterns;
  if (!allowed || !allowed.length) return;
  e.fireT -= dt;
  if (e.fireT > 0) return;
  let pattern = e.pattern;
  if (!patternAllowed(allowed, pattern)) pattern = pick(allowed);
  emitPattern(e, pattern);
  if (Math.random() < 0.3) e.pattern = pick(allowed);
  e.fireT = spec.shooterInterval * rand(0.92, 1.12);
}
function updateBigFire(e, dt) {
  if (!e.fires) return;
  const conf = e.type === 'elite' ? e.eliteSpec : spec.boss;
  if (!conf || !conf.patterns || !conf.patterns.length) return;
  const spd = conf.bulletSpeed || 0;
  if (!(spd > 0)) return;

  if (e.atk === 'spiral') {
    e.spiralT = (e.spiralT || 0) - dt;
    e.fireT -= dt;
    if (e.fireT <= 0) {
      e.spin = (e.spin || 0) + 0.4;
      emitDir(e.x, e.y, e.spin, spd * 0.68);
      emitDir(e.x, e.y, e.spin + Math.PI, spd * 0.68);
      e.fireT = 0.09;
    }
    if (e.spiralT <= 0) {
      e.atk = null;
      e.atkT = conf.interval;
    }
    return;
  }

  e.atkT -= dt;
  if (e.atkT > 0) return;
  const next = pick(conf.patterns);
  if (next === 'spiral') {
    e.atk = 'spiral';
    e.spiralT = 1.35;
    e.fireT = 0;
    e.spin = rand(0, 6);
    return;
  }
  const x = e.x, y = e.y + 8;
  if (next === 'aim1') emitAim(x, y, 1, 0, spd);
  else if (next === 'aim3') emitAim(x, y, 3, 0.2, spd);
  else if (next === 'aim5') emitAim(x, y, 5, 0.16, spd);
  else if (next === 'fan') emitAim(x, y, 7, 0.16, spd * 0.92);
  else if (next === 'spread' || next === 'spread5') emitDown(x, y, 5, 0.18, spd * 0.88);
  else if (next === 'down3') emitDown(x, y, 3, 0.24, spd);
  else if (next === 'ring') {
    emitRing(x, y, e.spin || 0, e.type === 'boss' ? 16 : 12, spd * 0.72);
    e.spin = (e.spin || 0) + 0.35;
  } else emitAim(x, y, 1, 0, spd);
  e.atk = null;
  e.atkT = conf.interval;
}

// ---------- player weapons ----------
function allyPos(i) {
  const side = i % 2 === 0 ? -1 : 1, rank = Math.floor(i / 2);
  const row = rank < 3 ? 0 : 1, col = rank % 3;
  const x = player.x + side * (row === 0 ? 32 + col * 22 : 18 + col * 22);
  return { x: clamp(x, 12, W - 12), y: PLAYER_Y + 8 + row * 24 + col * 3 };
}
function pushShot(o) {
  bullets.push(o);
  if (bullets.length > 900) bullets.splice(0, bullets.length - 900);
}
function fireFan(x, y, count, step, speed, dmg, range, pierce, kind, weapon) {
  for (let i = 0; i < count; i++) {
    const a = (i - (count - 1) / 2) * step;
    pushShot({
      x: x + (i - (count - 1) / 2) * 5, y, vx: Math.sin(a) * speed, vy: -Math.cos(a) * speed,
      dmg, pierce, range, traveled: 0, kind, weapon, hit: null, gates: null, dead: false, splash: 0,
    });
  }
}
function fireRocketAt(x, y, dmg, splash, speed, big) {
  pushShot({
    x, y, vx: 0, vy: -speed, dmg, pierce: 0, range: 1400, traveled: 0,
    kind: 'rocket', weapon: 'rocket', hit: null, gates: null, dead: false, splash, big: !!big,
  });
}
function pelletRaw(b) {
  if (b.kind !== 'pellet' || !b.range) return b.dmg;
  const t = b.traveled / b.range;
  const mul = t <= 0.38 ? 1 : Math.max(0.35, 1 - (t - 0.38) * 1.05);
  return Math.max(1, Math.round(b.dmg * mul));
}
function firePlayerWeapons(dt) {
  const w = stats.weapon;
  if (w === 'laser') {
    laserAcc += dt;
    const interval = 1 / laserTicksPerSec();
    let guard = 0;
    while (laserAcc >= interval && guard++ < 4) {
      laserAcc -= interval;
      pulseLaser(player.x, PLAYER_Y - 20, laserWidth(), laserTickDmg(), true);
      const allyD = Math.max(1, Math.round(laserTickDmg() * 0.14));
      for (let i = 0; i < stats.allies; i++) {
        const a = allyPos(i);
        pulseLaser(a.x, a.y - 12, 4.5, allyD, false);
      }
    }
    return;
  }
  fireT -= dt;
  const interval = w === 'sg' ? 1 / sgRate() : w === 'rocket' ? 1 / rocketRate() : 1 / stats.rate;
  if (fireT <= 0) {
    fireT += interval;
    if (fireT < 0) fireT = 0;
    if (w === 'mg') {
      fireFan(player.x, PLAYER_Y - 26, stats.multi, 0.085, 800, mgDmg(), 1300, stats.pierce, 'mg', 'mg');
      const ad = Math.max(1, Math.round(mgDmg() * 0.5));
      for (let i = 0; i < stats.allies; i++) {
        const a = allyPos(i);
        fireFan(a.x, a.y - 14, 1, 0, 800, ad, 1300, Math.max(0, stats.pierce - 1), 'mg', 'mg');
      }
    } else if (w === 'sg') {
      const n = 6 + stats.multi;
      const step = n <= 1 ? 0 : 1.05 / (n - 1);
      fireFan(player.x, PLAYER_Y - 22, n, step, 700, sgDmg(), 300, Math.min(2, stats.pierce), 'pellet', 'sg');
      const ad = Math.max(1, Math.round(sgDmg() * 0.4));
      for (let i = 0; i < stats.allies; i++) {
        const a = allyPos(i);
        fireFan(a.x, a.y - 12, 3, 0.22, 680, ad, 210, 0, 'pellet', 'sg');
      }
    } else if (w === 'rocket') {
      fireRocketAt(player.x, PLAYER_Y - 28, rocketDmg(), rocketSplash(), 280, true);
    }
  }
  if (w === 'rocket' && stats.allies > 0) {
    allyRocketAcc += dt;
    const every = Math.max(0.22, 0.9 - stats.allies * 0.045);
    if (allyRocketAcc >= every) {
      allyRocketAcc = 0;
      const i = allyCursor % stats.allies;
      allyCursor++;
      const a = allyPos(i);
      fireRocketAt(a.x, a.y - 14, Math.max(8, Math.round(rocketDmg() * 0.2)), 18, 300, false);
    }
  }
}

function applyDamage(e, raw, weapon, x, y, quiet) {
  if (!e || e.dead) return;
  const hit = resolveHit(Math.max(1, raw | 0), e.armor || 0, weapon);
  e.hp -= hit.dmg;
  e.flash = 0.07;
  if (hit.blocked) {
    burst(x, y, '#e6edf7', 4, 110, 2.4);
    if (!e.blockCd) {
      popText(e.x + rand(-6, 6), e.y - e.r - 2, 'ブロック', '#d7e3f4', 15, 0.48);
      e.blockCd = 0.32;
    }
  } else if (!quiet) {
    const big = weapon === 'rocket' || hit.dmg >= 24;
    if (big || !e.numCd) {
      popText(e.x + rand(-8, 8), e.y - e.r, String(hit.dmg), big ? '#ffd0a6' : '#fff', big ? 22 : 14, big ? 0.6 : 0.45);
      if (!big) e.numCd = 0.14;
    }
    if (big) burst(x, y, '#ffd7a8', 6, 150, 3);
  }
  if (e.hp <= 0) killEnemy(e);
}

function pulseLaser(x, y0, width, dmg, heavy) {
  const half = width / 2;
  for (const g of gates) {
    if (g.dead || g.used || g.laserCd > 0) continue;
    if (x >= g.x && x < g.x + g.w && g.y < y0 && g.y > -20) {
      g.laserCd = 0.1;
      bumpGate(g, x);
    }
  }
  for (const k of blocks) {
    if (k.dead || k.laserCd > 0) continue;
    if (Math.abs(k.x - x) < k.w / 2 + half && k.y < y0 && k.y > -40) {
      k.laserCd = heavy ? 0.08 : 0.12;
      hitBlock(k, 1, x, k.y);
    }
  }
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.y > y0 + 6) continue;
    if (Math.abs(e.x - x) <= half + e.r * 0.55) applyDamage(e, dmg, 'laser', x, e.y, !heavy);
  }
}

function bumpGate(g, x) {
  g.acc += 1; g.flash = 0.05;
  const need = g.v < 0 ? 4 : 20, cap = GATE_CAP[g.key];
  if (g.acc >= need && g.v < cap) { g.acc = 0; g.v += 1; popText(x, g.y, '+1', '#9fffd0', 16, 0.5); }
}
function hitBlock(k, amount, x, y) {
  k.n -= amount; k.flash = 0.06; k.pulse = 0.12;
  const col = k.kind === 'weapon' ? WEAPONS[k.key].color : UPGRADES[k.key].color;
  burst(x, y, col, 2, 120, 3);
  if (k.n <= 0) {
    k.dead = true;
    if (k.kind === 'weapon') applyWeapon(k.key, k.x, k.y);
    else applyUpgrade(k.key, k.x, k.y);
    score += k.kind === 'weapon' ? 40 : 50;
  }
}
function explodeRocket(b, primary) {
  const r = b.splash || 0;
  burst(b.x, b.y, b.big ? '#ff7a3c' : '#ffb07a', b.big ? 26 : 10, b.big ? 260 : 160, b.big ? 5 : 3);
  burst(b.x, b.y, '#ffe14a', b.big ? 10 : 4, 140, 2.5);
  rings.push({ x: b.x, y: b.y, r: 6, life: b.big ? 0.38 : 0.22, color: '#ffb15a' });
  if (b.big) addShake(3.5);
  if (r > 0) {
    for (const e of enemies) {
      if (e.dead || e === primary) continue;
      const dx = e.x - b.x, dy = e.y - b.y;
      if (dx * dx + dy * dy <= (r + e.r * 0.6) * (r + e.r * 0.6)) {
        applyDamage(e, Math.max(1, Math.round(b.dmg * (b.big ? 0.48 : 0.4))), 'rocket', e.x, e.y, !b.big);
      }
    }
  }
  b.dead = true;
}

function hurtPlayer(amount) {
  if (state !== 'play') return;
  if (player.hurt > 0) return;
  stats.hp -= amount;
  player.hurt = 0.8;
  flash = 0.4;
  addShake(amount >= 3 ? 12 : 8);

function killAllyAt(x, y) {

  burst(a.x, a.y, '#33d17a', 18, 220, 4);

function runFightSpawns(dt) {
  if (spec.elite && !eliteRolled && stageTime >= spec.elite.after && stageTime < spec.duration - 12) {
    eliteRolled = true;
    if (Math.random() < spec.elite.chance && !aliveType('elite')) spawnEnemy('elite');
  }
  spawnT -= dt;
  if (spawnT <= 0) {
    spawnWave();
    spawnT = currentSpawnEvery();
  }
  blockT -= dt;
  if (blockT <= 0) {
    spawnBlock();
    blockT = randRange(spec.blockEvery);
  }
  weaponT -= dt;
  if (weaponT <= 0) {
    if (!guaranteedWeaponSpawned && spec.guaranteeWeapon) {
      spawnWeaponBlock(spec.guaranteeWeapon);
      guaranteedWeaponSpawned = true;
    } else spawnWeaponBlock();
    weaponT = randRange(spec.weaponEvery);
  }
  gateT -= dt;
  if (gateT <= 0) {
    spawnGates();
    gateT = randRange(spec.gateEvery);
  }
}

// ---------- update ----------
function update(dt) {
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  shake = Math.max(0, shake - dt * 30);
  flash = Math.max(0, flash - dt);
  for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy = p.vy * 0.92 + 300 * dt; if (p.life <= 0) p.dead = true; }
  removeDead(particles);
  for (const t of texts) { t.life -= dt; t.y += t.vy * dt; t.vy *= 0.94; if (t.life <= 0) t.dead = true; }
  removeDead(texts);
  for (const r of rings) { r.life -= dt; r.r += 420 * dt; if (r.life <= 0) r.dead = true; }
  removeDead(rings);
  if (state === 'over') { overT += dt; return; }
  if (state !== 'play') return;

  time += dt;
  player.x += (player.tx - player.x) * Math.min(1, dt * 18);
  player.hurt = Math.max(0, player.hurt - dt);

  if (stagePhase === 'clear') {
    clearT -= dt;
    if (clearT <= 0) {
      stageNum += 1;
      beginStage();
    }
  } else if (stagePhase === 'fight') {
    stageTime += dt;
    if (stageTime >= spec.duration) {
      stagePhase = 'boss';
      spawnEnemy('boss');
    } else {
      runFightSpawns(dt);
    }
  } else if (stagePhase === 'boss') {
    stageTime += dt;
    if (aliveType('boss')) bossGap = 1.8;
    else {
      bossGap -= dt;
      if (bossGap <= 0) {
        spawnEnemy('boss');
        bossGap = 1.8;
      }
    }
  }

  firePlayerWeapons(dt);

  for (const b of bullets) {
    if (b.dead) continue;
    const step = Math.hypot(b.vx, b.vy) * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.traveled += step;
    if (b.y < -30 || b.x < -30 || b.x > W + 30 || (b.range && b.traveled >= b.range)) { b.dead = true; continue; }
    // Gates stay permeable: a projectile ticks each gate once, then flies on.
    for (const g of gates) {
      if (g.dead || g.used || (b.gates && b.gates.has(g))) continue;
      if (b.x >= g.x && b.x < g.x + g.w && b.y > g.y - g.h / 2 && b.y < g.y + g.h / 2) {
        (b.gates || (b.gates = new Set())).add(g);
        bumpGate(g, b.x);
      }
    }
    for (const k of blocks) {
      if (k.dead || b.dead) continue;
      if (b.x > k.x - k.w / 2 && b.x < k.x + k.w / 2 && b.y > k.y - k.h / 2 && b.y < k.y + k.h / 2) {
        const amount = b.kind === 'rocket' ? (b.big ? 8 : 3) : 1;
        hitBlock(k, amount, b.x, b.y);
        if (b.kind === 'rocket') explodeRocket(b, null);
        else b.dead = true;
        break;
      }
    }
    if (b.dead) continue;
    for (const e of enemies) {
      if (e.dead) continue;
      if (b.hit && b.hit.has(e)) continue;
      const dx = b.x - e.x, dy = b.y - e.y;
      const rad = e.r + (b.kind === 'rocket' ? 12 : 4);
      if (dx * dx + dy * dy < rad * rad) {
        const raw = pelletRaw(b);
        if (b.kind === 'rocket') {
          applyDamage(e, raw, 'rocket', b.x, b.y, false);
          explodeRocket(b, e);
          break;
        }
        applyDamage(e, raw, b.weapon, b.x, b.y, false);
        if (b.pierce > 0) { b.pierce--; (b.hit || (b.hit = new Set())).add(e); }
        else { b.dead = true; break; }
      }
    }
  }
  removeDead(bullets);

  for (const e of enemies) {
    if (e.dead) continue;
    e.wob += dt * 4;
    e.flash = Math.max(0, e.flash - dt);
    e.blockCd = Math.max(0, e.blockCd - dt);
    e.numCd = Math.max(0, e.numCd - dt);
    e.age += dt;
    if (e.type === 'boss' || e.type === 'elite') {
      const hover = e.stopY || 160;
      const enrageAt = e.type === 'boss' ? 26 : 20;
      if (!e.enrage && e.age > enrageAt) e.enrage = true;
      if (e.y < hover) { e.y += e.vy * dt; if (e.y > hover) e.y = hover; }
      else if (!e.enrage) e.y = hover + Math.sin(time * 1.05 + e.age) * 16;
      else e.y += 28 * dt;
      const amp = e.type === 'boss' ? 128 : 96;
      e.x = clamp(W / 2 + Math.sin(time * 0.78 + e.age) * amp, e.r + 8, W - e.r - 8);
    } else if (e.fires && e.stopY) {
      if (!e.hold && e.y >= e.stopY) { e.hold = true; e.vy = rand(8, 16); }
      e.y += e.vy * dt;
      e.x = clamp(e.x + Math.sin(e.wob) * (e.hold ? 34 : 16) * dt, 20, W - 20);
    } else {
      e.y += e.vy * dt;
      e.x = clamp(e.x + Math.sin(e.wob) * 20 * dt, 16, W - 16);
    }
    if (e.fires) updateEnemyFire(e, dt);
    if (e.dead) continue;
    if (e.y + e.r * 0.45 > DEFENSE_Y) {
      e.dead = true;
      burst(e.x, DEFENSE_Y, e.color, 22, 240, 5);
      hurtPlayer(bodyDamage(e));
      if (state !== 'play') return;
    }
  }
  removeDead(enemies);

  for (const b of ebullets) {
    if (b.dead) continue;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 36 || b.y < -60 || b.x < -40 || b.x > W + 40) { b.dead = true; continue; }
    const pdx = b.x - player.x, pdy = b.y - PLAYER_Y;
    const pr = 16 + b.r;
    if (pdx * pdx + pdy * pdy < pr * pr) {
      b.dead = true;
      burst(b.x, b.y, '#ff4b8a', 12, 180, 3.2);
      if (player.hurt <= 0) {
        hurtPlayer(1);
        if (state !== 'play') return;
      }
      continue;
    }
    if (stats.allies > 0 && killAllyAt(b.x, b.y)) b.dead = true;
  }
  removeDead(ebullets);

  for (const k of blocks) {
    if (k.dead) continue;
    k.y += k.vy * dt;
    k.flash = Math.max(0, k.flash - dt);
    k.pulse = Math.max(0, k.pulse - dt);
    k.laserCd = Math.max(0, (k.laserCd || 0) - dt);
    if (k.y - k.h / 2 > DEFENSE_Y) {
      k.dead = true;
      popText(k.x, DEFENSE_Y - 20, k.kind === 'weapon' ? '武器ロスト…' : '強化ロスト…', '#aaa', 20, 1);
    }
  }
  removeDead(blocks);

  for (const g of gates) {
    if (g.dead) continue;
    g.y += g.vy * dt;
    g.flash = Math.max(0, g.flash - dt);
    g.laserCd = Math.max(0, (g.laserCd || 0) - dt);
    if (!g.used && g.y >= PLAYER_Y) {
      const inside = player.x >= g.x && player.x < g.x + g.w;
      gates.forEach(o => { if (o.gid === g.gid) o.used = true; });
      const chosen = inside ? g : gates.find(o => o.gid === g.gid && o !== g);
      if (chosen) applyGate(chosen);
    }
    if (g.y > H + 60) g.dead = true;
  }
  removeDead(gates);
}

}
function drawPlayerShots() {
  for (const b of bullets) {
    if (b.kind === 'rocket') {
      ctx.save(); ctx.translate(b.x, b.y);
      ctx.fillStyle = b.big ? '#ff5a2a' : '#ff8a55';
      ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(7, 8); ctx.lineTo(-7, 8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffe14a'; ctx.fillRect(-2.5, 8, 5, 8);
      ctx.restore();
    } else if (b.kind === 'pellet') {
      ctx.fillStyle = 'rgba(255,154,60,0.35)';
      ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd7a4';
      ctx.beginPath(); ctx.arc(b.x, b.y, 2.6, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,225,74,0.35)';
      ctx.fillRect(b.x - 3.5, b.y - 9, 7, 16);
      ctx.fillStyle = '#fff6a8';
      ctx.fillRect(b.x - 1.6, b.y - 7, 3.2, 12);
    }
  }
}
function drawLaserBeams() {
  if (state === 'over' || stats.weapon !== 'laser') return;
  const pulse = 0.55 + Math.sin(time * 28) * 0.15;
  const beams = [{ x: player.x, w: laserWidth(), a: pulse, y: PLAYER_Y - 18 }];
  for (let i = 0; i < stats.allies; i++) {
    const a = allyPos(i);
    beams.push({ x: a.x, w: 4.5, a: pulse * 0.55, y: a.y - 10 });
  }
  for (const b of beams) {
    const grd = ctx.createLinearGradient(0, b.y, 0, 0);
    grd.addColorStop(0, 'rgba(120, 240, 255,' + b.a + ')');
    grd.addColorStop(1, 'rgba(180, 255, 255, 0.02)');
    ctx.fillStyle = grd;
    ctx.fillRect(b.x - b.w / 2, 0, b.w, b.y);
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.95, b.a + 0.25) + ')';
    ctx.fillRect(b.x - 1.1, 0, 2.2, b.y);
  }
}
function drawEnemyBullets() {
  for (const b of ebullets) {
    ctx.fillStyle = 'rgba(255, 40, 120, 0.33)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff2d6a';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe4f2';
    ctx.beginPath(); ctx.arc(b.x - 1.2, b.y - 1.2, b.r * 0.38, 0, Math.PI * 2); ctx.fill();
  }
}
function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, 64);
  ctx.textBaseline = 'middle';
  const wpn = WEAPONS[stats.weapon];
  ctx.font = 'bold 18px ' + FONT; ctx.textAlign = 'center';
  const nw = ctx.measureText(wpn.name).width;
  drawWeaponIcon(stats.weapon, W / 2 - nw / 2 - 14, 22, 0.78);
  ctx.fillStyle = wpn.color; ctx.fillText(wpn.name, W / 2 + 8, 22);
  ctx.textAlign = 'left';
  ctx.font = 'bold 20px ' + FONT; ctx.fillStyle = '#ffe14d';
  ctx.fillText('スコア ' + score, 12, 20);
  ctx.font = 'bold 13px ' + FONT; ctx.fillStyle = '#cfe3ff';
  ctx.fillText('撃破 ' + kills + '   ' + Math.floor(time) + '秒', 12, 46);
  ctx.font = 'bold 15px ' + FONT; ctx.fillStyle = '#ffe14d'; ctx.textAlign = 'center';
  ctx.fillText('ステージ' + stageNum, W / 2, 46);
  ctx.textAlign = 'right'; ctx.font = '18px ' + FONT;
  let hs = ''; for (let i = 0; i < stats.maxHp; i++) hs += i < stats.hp ? '❤' : '♡';
  ctx.fillStyle = '#ff4d6d'; ctx.fillText(hs, W - 10, 20);
  ctx.font = 'bold 12px ' + FONT; ctx.fillStyle = '#cfe3ff'; ctx.fillText('ベスト ' + best, W - 10, 46);
  const items = [
    ['発射', stats.multi, '#ff4fa3'], ['連射', stats.rate.toFixed(1), '#ffb321'], ['攻撃', stats.power, '#ff5a3c'],
    ['仲間', stats.allies, '#33d17a'], ['貫通', stats.pierce, '#3fa9ff'],
  ];
  const bw = (W - 12) / items.length;
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, H - 40, W, 40);
  items.forEach((it, i) => {
    const x = 6 + bw * i + bw / 2;
    ctx.textAlign = 'center'; ctx.font = 'bold 11px ' + FONT; ctx.fillStyle = it[2]; ctx.fillText(it[0], x, H - 29);
    ctx.font = 'bold 16px ' + FONT; ctx.fillStyle = '#fff'; ctx.fillText(String(it[1]), x, H - 12);
  });
}
function drawCenterText(lines) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const l of lines) {
    ctx.font = 'bold ' + l.size + 'px ' + FONT;
    ctx.lineWidth = l.size / 5; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText(l.t, W / 2, l.y);
    ctx.fillStyle = l.c || '#fff'; ctx.fillText(l.t, W / 2, l.y);
  }
}
function render() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  drawBackground();
  for (const e of enemies) drawEnemy(e);
  for (const g of gates) drawGate(g);
  for (const k of blocks) drawBlock(k);
  drawLaserBeams();
  drawPlayerShots();
  drawEnemyBullets();
  if (state !== 'over') {
    for (let i = 0; i < stats.allies; i++) { const a = allyPos(i); drawSoldier(a.x, a.y, 0.62, '#33d17a', false); }
    const blink = player.hurt > 0 && Math.floor(player.hurt * 18) % 2 === 0;
    drawSoldier(player.x, PLAYER_Y, 1.15, '#3fa9ff', blink);
  }
  for (const r of rings) { ctx.strokeStyle = r.color; ctx.globalAlpha = Math.max(0, r.life * 2); ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke(); }
  ctx.globalAlpha = 1;
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const a = Math.min(1, t.life / t.max * 2), sc = 1 + Math.max(0, (t.life / t.max - 0.8)) * 2;
    ctx.globalAlpha = a; ctx.font = 'bold ' + Math.round(t.size * sc) + 'px ' + FONT;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText(t.str, t.x, t.y);
    ctx.fillStyle = t.color; ctx.fillText(t.str, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = 'rgba(255,40,70,' + flash * 0.75 + ')'; ctx.fillRect(0, 0, W, H); }
  if (state === 'play' || state === 'over') drawHUD();
  if (banner && state === 'play') {
    ctx.globalAlpha = Math.min(1, banner.t * 2);
    ctx.fillStyle = 'rgba(40,10,50,0.78)'; ctx.fillRect(0, H * 0.3, W, 54);
    drawCenterText([{ t: banner.text, y: H * 0.3 + 27, size: 26, c: '#ffe14d' }]);
    ctx.globalAlpha = 1;
  }
  if (state === 'title') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
    const bob = Math.sin(performance.now() / 300) * 6;
    drawCenterText([
      { t: '撃って強化！', y: 200 + bob, size: 48, c: '#ffe14d' },
      { t: 'ラストシューター', y: 258 + bob, size: 36, c: '#ff4fa3' },
      { t: '降ってくる敵を撃ちまくれ！', y: 328, size: 20 },
      { t: 'ボスを倒すと次のステージへ', y: 360, size: 16, c: '#ffe9a0' },
      { t: '赤く光る敵弾に当たるとハートが減る', y: 398, size: 16, c: '#ff9ec4' },
      { t: '武器ブロックを壊すと武器が切り替わる', y: 434, size: 16, c: '#9fe3ff' },
      { t: '装甲兵はレーザーとロケット向き', y: 470, size: 16, c: '#d5deea' },
      { t: 'ドラッグで左右に移動（自動射撃）', y: 508, size: 16, c: '#cfe3ff' },
    ]);
    if (Math.floor(performance.now() / 500) % 2 === 0) drawCenterText([{ t: 'タップしてスタート', y: 580, size: 28 }]);
    drawSoldier(W / 2, 690, 1.5, '#3fa9ff', false);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(0.65, overT) + ')'; ctx.fillRect(0, 0, W, H);
    const lines = [
      { t: 'ゲームオーバー', y: 200, size: 42, c: '#ff4d6d' },
      { t: 'スコア  ' + score, y: 268, size: 32, c: '#ffe14d' },
      { t: '到達ステージ  ' + stageNum, y: 318, size: 26 },
      { t: 'ベストスコア  ' + best, y: 362, size: 20, c: '#ffe14d' },
      { t: 'ベストステージ  ' + bestStage, y: 394, size: 20, c: '#cfe3ff' },
      { t: '撃破 ' + kills + '　生存 ' + Math.floor(time) + '秒', y: 434, size: 18, c: '#cfe3ff' },
      { t: '武器  ' + WEAPONS[stats.weapon].name, y: 468, size: 18, c: WEAPONS[stats.weapon].color },
    ];
    if (recordKind === 'score') lines.push({ t: '★ 新記録！ ★', y: 516, size: 26, c: '#33e08a' });
    else if (recordKind === 'stage') lines.push({ t: '★ ステージ記録！ ★', y: 516, size: 24, c: '#33e08a' });
    drawCenterText(lines);
    if (overT > 0.6 && Math.floor(performance.now() / 500) % 2 === 0) drawCenterText([{ t: 'タップでリトライ', y: 570, size: 28 }]);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__game = {
  get state() { return state; },
  get stats() { return stats; },
  get score() { return score; },
  get time() { return time; },
  get stage() { return stageNum; },
  get phase() { return stagePhase; },
  get stageTime() { return stageTime; },
  get bestStage() { return bestStage; },
  get banner() { return banner ? banner.text : ''; },
  get weapon() { return stats.weapon; },
  get hp() { return stats.hp; },
  get spec() { return spec; },
  get counts() {
    let armor = 0, shooters = 0, weaponBlocks = 0, firing = 0;
    for (const e of enemies) {
      if (e.dead) continue;
      if ((e.armor || 0) > 0 && e.type !== 'boss') armor++;
      if (e.type === 'shooter') shooters++;
      if (e.fires && e.type !== 'boss' && e.type !== 'elite') firing++;
    }
    for (const b of blocks) if (!b.dead && b.kind === 'weapon') weaponBlocks++;
    return { enemies: enemies.length, blocks: blocks.length, gates: gates.length, bullets: bullets.length, ebullets: ebullets.length, particles: particles.length, armor, shooters, firing, weaponBlocks };
  },
  world() { return { gates, bullets, ebullets, enemies, blocks, player, stats, texts }; },
  setKeepAlive(v) { keepAlive = !!v; },
  step(dt) { update(typeof dt === 'number' ? dt : 1 / 60); },
  start() { state = 'play'; reset(); },
  jumpToBoss() { if (stagePhase === 'fight') stageTime = spec.duration; },
  killStageBoss() {
    for (const e of enemies) if (e.type === 'boss' && !e.dead) { e.hp = 0; killEnemy(e); }
  },
};
})();
</script>
